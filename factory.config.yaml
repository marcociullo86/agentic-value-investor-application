pattern_version: "2.17"
topology: full-stack-agents

# v2.12 multi-repo: legacy code_path auto-promosso se code_paths assente
code_paths:
  - name: default
    path: ./src/
    layers: [be, fe, db, qa, infra]
    tags: [monorepo, value-investing-app]
    vcs:
      mode: monorepo
      branch_strategy: shared
      commit_coupling: float

# Backward compat v2.11
code_path: ./src/

stack_mode: auto

routing:
  be: agent
  fe: agent
  db: agent
  qa: agent
  infra: agent

stack:
  backend: "Kotlin 2.2 + Spring Boot 3.5 (JVM 17+)"
  frontend: "React 19 + Next.js 16.x (App Router + RSC + Turbopack)"
  database: "PostgreSQL 17 + Flyway 10.x + Spring Data JPA"
  qa: "JUnit 5 + Testcontainers + Playwright + Vitest"

vcs:
  mode: monorepo
  branch_strategy: shared
  commit_coupling: float

adapters:
  - name: claude
    folder: .claude
    maturity: full
  - name: cursor
    folder: .cursor
    maturity: full

kanban_publish:
  provider: none

scheduler:
  enabled: true
  max_parallel: 4
  parallel_gate_threshold: 3
  code_path_conflict: strict
  empty_code_path_policy: serial
  domains:
    ingest: true
    develop: true
    lint: true
    query: true
    plan: false
    design: false
    publish: false
    sync: true
    review: true
    premortem: true       # v2.16 — /premortem su target distinti in parallelo (default parallel, ADR-004); composizione N×M con cap interno Fase 4 (max_parallel: 8 hardcoded, ADR-001)
    visual-oracle: true   # v2.17 — sub-step di L2 (develop) per TSK FE; attivo perché fe_correctness.enabled: true (ADR-012 §F)

# FE Visual Oracle (v2.17, PATTERN §3 variante di Develop FE) — opt-in, qui ATTIVO.
# Chiude il loop visivo del frontend: render headless (Playwright) + screenshot
# multi-viewport/tema + critica visiva LLM (pattern evaluator-optimizer, come CQRL).
# Ordering: develop → visual-oracle → review. Single-writer di visual_status = skill
# visual-oracle-protocol. Prerequisito: Playwright nel code_path FE (vedi
# wiki/runbooks/visual-oracle-installation.md) — fail-loud se assente.
fe_correctness:
  enabled: true              # master switch: Fase 4-bis Visual Verification in dev-protocol
  max_iterations: 3          # bound loop conditional (analogo R.Q4 di CQRL)
  viewports:
    - { name: mobile,  width: 375  }
    - { name: desktop, width: 1280 }
  themes:
    - light
    - dark
  checks: []                 # opt-in: [visual-regression, axe-a11y, interaction-test]
  state_matrix_inject: false # scrivi-task inietta State Matrix nei TSK FE
  granularity_lint: false    # Lint Check 4n WARNING-only
  granularity:
    max_estimate_hours: 8
    max_states: 3
  dispatch_gate: false       # Orchestrator Oracle Pre-Check FE

code_quality:
  enabled: true
  max_iterations: 3
  thresholds:
    confidence_min: 0.6
    batching_split: 7
    pass_rate_warn: 0.05
    false_positive_warn: 0.30
  passes:
    idiomaticity: true
    design: true
    robustness: true
    premortem-on-merge: true   # v2.16 — 4° pass: mini-premortem sul diff (timeframe 3mo, max 3-5 finding) come sotto-sezione del verdict (ADR-005)
  router:
    strategy: severity-tiered
    max_diff_lines: 80
    ordering: severity_then_complexity
  ruleset:
    path: ./code_quality/rules/
    tiers: [canonical, emergent, team-specific]
    evolve:
      enabled: false
      cadence_days: 7
  reports:
    path: ./code_quality/reports/
    retain_iterations: 5
    digest_cadence: weekly

# Compression layer (v2.14, PATTERN §20) — opt-in, default OFF (R.C6 / R.G6)
compression:
  output:
    provider: caveman
    enabled: false
    install_command: "curl -fsSL https://raw.githubusercontent.com/JuliusBrussee/caveman/main/install.sh | bash"
    policy_profile: conservative
    invariants:
      to_user: off
      to_artifact: off
      propagate_resolution: off
    channels:
      orchestrator_to_subagent: full
      subagent_to_tool: ultra
      tool_to_subagent: lite
      subagent_to_orchestrator: full
      sibling_to_sibling: full
      feedback_router_to_devagent: full
    chain_depth_downgrade: true
    chain_depth_threshold: 3
    cross_factory: off
    drift_fallback:
      enabled: true
      markers: [AMBIGUOUS_HANDOFF, REQUEST_CLARIFY]
    audit_trail_for:
      - propagate-resolution
      - feedback-router
  context:
    provider: none
    enabled: false
    package: graphifyy
    install_command: "pip install graphifyy"
    ollama:
      model: llama3.1:8b
      vram_gb_min: 16
    targets:
      - kind: code_path
        name: default
        gitignore_patterns:
          - "*.env"
          - ".env.*"
          - "secrets/**"
          - "node_modules/**"
          - "dist/**"
          - "build/**"
          - ".next/**"
    update_strategy: incremental
    full_rebuild_cron: "0 0 * * 0"
    drift_alert_days: 7
    full_rebuild_cost_warn: 5
    ghost_duplicates_warn: 10
    ci_strategy:
      mode: cache-with-fallback
      cache_provider: actions
      cache_key_prefix: graphify-state
      stale_threshold_hours: 168
      full_rebuild_on_demand: true
    confidence_gating:
      executor: [EXTRACTED]
      explorer: [EXTRACTED, INFERRED]
      reviewer: [EXTRACTED, INFERRED, AMBIGUOUS]
    mcp_server:
      enabled: false
      topology: per-agent
      crg_tools_max: 8
