pattern_version: "2.33"
# Upgrade 2026-06-16: v2.17 → v2.21 (delta additivo non distruttivo, factory-upgrade-protocol).
# v2.18 (a11y + ux_ui), v2.19 (temporal, release_governance, complexity_budget, dogfooding),
# v2.20 (functional_oracle), v2.21 (design_intelligence, token_ledger) — tutte opt-in, default false.
topology: full-stack-agents

# v2.12 multi-repo: legacy code_path auto-promosso se code_paths assente
code_paths:
  - name: default
    path: ./src/
    layers: [be, fe, db, qa, infra]
    tags: [monorepo, value-investing-app]
    vcs:
      mode: monorepo
      branch_strategy: shared
      commit_coupling: float

# Backward compat v2.11
code_path: ./src/

stack_mode: auto

routing:
  be: agent
  fe: agent
  db: agent
  qa: agent
  infra: agent

stack:
  backend: "Kotlin 2.2 + Spring Boot 3.5 (JVM 17+)"
  frontend: "React 19 + Next.js 16.x (App Router + RSC + Turbopack)"
  database: "PostgreSQL 17 + Flyway 10.x + Spring Data JPA"
  qa: "JUnit 5 + Testcontainers + Playwright + Vitest"

vcs:
  mode: monorepo
  branch_strategy: shared
  commit_coupling: float

adapters:
  - name: claude
    folder: .claude
    maturity: full
  - name: cursor
    folder: .cursor
    maturity: full

kanban_publish:
  provider: none

scheduler:
  enabled: true
  max_parallel: 20
  parallel_gate_threshold: 3
  code_path_conflict: strict
  empty_code_path_policy: serial
  domains:
    ingest: true
    develop: true
    lint: true
    query: true
    plan: false
    design: false
    publish: false
    sync: true
    review: true
    premortem: true       # v2.16 — /premortem su target distinti in parallelo (default parallel, ADR-004); composizione N×M con cap interno Fase 4 (max_parallel: 8 hardcoded, ADR-001)
    visual-oracle: true   # v2.17 — sub-step di L2 (develop) per TSK FE; attivo perché fe_correctness.enabled: true (ADR-012 §F)
    a11y: false           # v2.18 — accessibility testing WCAG 2.2 AA (opt-in, default off)
    ux-ui-review: false   # v2.18 — UX/UI Review & Design (opt-in, default off)
    analytics: false      # v2.18 — Task Analytics cost/time measurement (opt-in, default off)
    functional-oracle: false  # v2.20 — FE Functional Oracle EP-018 (opt-in, default off)

# FE Visual Oracle (v2.17, PATTERN §3 variante di Develop FE) — opt-in, qui ATTIVO.
# Chiude il loop visivo del frontend: render headless (Playwright) + screenshot
# multi-viewport/tema + critica visiva LLM (pattern evaluator-optimizer, come CQRL).
# Ordering: develop → visual-oracle → review. Single-writer di visual_status = skill
# visual-oracle-protocol. Prerequisito: Playwright nel code_path FE (vedi
# wiki/runbooks/visual-oracle-installation.md) — fail-loud se assente.
fe_correctness:
  enabled: true              # master switch: Fase 4-bis Visual Verification in dev-protocol
  max_iterations: 3          # bound loop conditional (analogo R.Q4 di CQRL)
  viewports:
    - { name: mobile,  width: 375  }
    - { name: desktop, width: 1280 }
  themes:
    - light
    - dark
  checks: []                 # opt-in: [visual-regression, axe-a11y, interaction-test]
  state_matrix_inject: false # scrivi-task inietta State Matrix nei TSK FE
  granularity_lint: false    # Lint Check 4n WARNING-only
  granularity:
    max_estimate_hours: 8
    max_states: 3
  dispatch_gate: false       # Orchestrator Oracle Pre-Check FE
  # Functional Oracle (v2.20, EP-018) — opt-in, default OFF (R.P3)
  functional_oracle:
    enabled: false
    timeout_seconds: 120
    headless: true
    fixture_dir: code_quality/fixtures
    acceptance_spec_dir: code_quality/acceptance

code_quality:
  enabled: true
  max_iterations: 3
  thresholds:
    confidence_min: 0.6
    batching_split: 7
    pass_rate_warn: 0.05
    false_positive_warn: 0.30
  passes:
    idiomaticity: true
    design: true
    robustness: true
    premortem-on-merge: true   # v2.16 — 4° pass: mini-premortem sul diff (timeframe 3mo, max 3-5 finding) come sotto-sezione del verdict (ADR-005)
  router:
    strategy: severity-tiered
    max_diff_lines: 80
    ordering: severity_then_complexity
  ruleset:
    path: ./code_quality/rules/
    tiers: [canonical, emergent, team-specific]
    evolve:
      enabled: false
      cadence_days: 7
  reports:
    path: ./code_quality/reports/
    retain_iterations: 5
    digest_cadence: weekly

# Compression layer (v2.14, PATTERN §20) — opt-in, default OFF (R.C6 / R.G6)
compression:
  output:
    provider: caveman
    enabled: false
    install_command: "curl -fsSL https://raw.githubusercontent.com/JuliusBrussee/caveman/main/install.sh | bash"
    policy_profile: conservative
    invariants:
      to_user: off
      to_artifact: off
      propagate_resolution: off
    channels:
      orchestrator_to_subagent: full
      subagent_to_tool: ultra
      tool_to_subagent: lite
      subagent_to_orchestrator: full
      sibling_to_sibling: full
      feedback_router_to_devagent: full
    chain_depth_downgrade: true
    chain_depth_threshold: 3
    cross_factory: off
    drift_fallback:
      enabled: true
      markers: [AMBIGUOUS_HANDOFF, REQUEST_CLARIFY]
    audit_trail_for:
      - propagate-resolution
      - feedback-router
    # Decision Anchor (v2.19, EP-015) — opt-in, default OFF
    decision_anchor:
      enabled: false
      required_on_chain: false
    # Consistency Check (v2.19, EP-015) — opt-in, default OFF
    consistency_check:
      enabled: false
    # Migration tracking (v2.19)
    migration:
      v2_15_to_v2_19_complete: false
  context:
    provider: none
    enabled: false
    package: graphifyy
    install_command: "pip install graphifyy"
    ollama:
      model: llama3.1:8b
      vram_gb_min: 16
    targets:
      - kind: code_path
        name: default
        gitignore_patterns:
          - "*.env"
          - ".env.*"
          - "secrets/**"
          - "node_modules/**"
          - "dist/**"
          - "build/**"
          - ".next/**"
    update_strategy: incremental
    full_rebuild_cron: "0 0 * * 0"
    drift_alert_days: 7
    full_rebuild_cost_warn: 5
    ghost_duplicates_warn: 10
    ci_strategy:
      mode: cache-with-fallback
      cache_provider: actions
      cache_key_prefix: graphify-state
      stale_threshold_hours: 168
      full_rebuild_on_demand: true
    confidence_gating:
      executor: [EXTRACTED]
      explorer: [EXTRACTED, INFERRED]
      reviewer: [EXTRACTED, INFERRED, AMBIGUOUS]
    mcp_server:
      enabled: false
      topology: per-agent
      crg_tools_max: 8

# ============================================================================
# Capability opt-in introdotte con l'upgrade v2.18→v2.21 — TUTTE default false.
# A flag spento sono no-op: comportamento identico a v2.17.
# ============================================================================

# A11y (v2.18, EP-007) — Accessibility Testing WCAG 2.2 AA. Opt-in totale (R.P3).
a11y:
  enabled: false             # master switch
  wcag_level: AA
  standard: WCAG2.2
  tool: axe-core
  scan_on_develop: false
  fail_on_critical: true
  fail_on_serious: false
  skip_reason_required: true

# UX/UI Review & Design (v2.18, EP-008) — opt-in totale (R.P3).
ux_ui:
  enabled: false             # master switch
  review:
    enabled: false
    max_iterations: 3
    auto_reject_on_fabrication: true
  design:
    enabled: false
    reasoning_first: true    # v2.21 EP-019 Design Intelligence gate
  anti_fabrication:
    enabled: true
    require_evidence: true

# Task Analytics (v2.18, EP-009 measurement + EP-010 estimation + v2.19 dogfooding + v2.21 token_ledger)
analytics:
  measurement:
    enabled: false           # master switch EP-009 (R.P3)
    agent: false
    store: jsonl
    rotation: monthly
    compress_older_than_months: 0
    jsonl_scan_warn_lines: 500000
    event_store_path: analytics/events
    pricing_table_path: analytics/pricing.yaml
    rate_card_path: analytics/rates.yaml
    rate_basis: fully-loaded
    report_compression_savings: false
    min_aggregation_n: 5
    operational_show_actor_id: false
    actors_map: {}
    tools_dir: .claude/tools/analytics
    drift_warn_days: 90
    granularity: tsk
    required_on_done: false
  estimation:
    enabled: false           # master switch EP-010 (R.P3)
    agent: false
    rcf_min_samples: 10
    rcf_low_confidence_threshold: 1
    rcf_medium_confidence_threshold: 10
    rcf_high_confidence_threshold: 30
    similarity_factor:
      high: 1.0
      medium: 0.7
      low: 0.4
    default_contingency_pct: 15
    default_M_per_layer:
      fe: 4
      be: 3
      db: 2
      qa: 2
      docs: 1
    default_model: "current"
    monte_carlo:
      runtime: python
      iterations: 10000
      seed: null
    required_on_kickoff: false
  dogfooding:
    enabled: false           # v2.19 EP-013 — auto-misurazione (R.P3)
    privacy_policy_path: analytics/PRIVACY.md
    lock_strategy: flock-advisory
    lock_timeout_seconds: 5
    idempotency_strategy: hash-compound
  token_ledger:
    enabled: false           # v2.21 EP-022 — visibilità token inline (R.P3)
    display_mode: compact
    show_cache_savings: true
    auto_call_on_wave_close: false
    pricing_fallback: prefix-based

# Temporal Budget Governor (v2.19, EP-014) — opt-in totale (R.P3).
temporal:
  enabled: false
  budget_strategy: strict    # strict (default) | adaptive (rinviato v2.20+)
  p85_default_hours: 8
  override_allowed: true
  warn_on_skip: true

# Release Governance (v2.19, EP-012, PATTERN §22) — opt-in totale (R.P3).
release_governance:
  battle_test_gate:
    enabled: false           # gate /release: blocca tag senza ≥N RUN-REPORT validi
    min_run_reports: 3
    run_report_path: "wiki/run-reports/"

# Adoption Profile (v2.19, EP-016, PATTERN §23)
adoption_profile: standard   # standard | minimal | advanced | custom

# Complexity Budget (v2.19, EP-016, PATTERN §23)
complexity_budget:
  required_on_release: false # lint gate WARNING-only: N:1 check pre-release

# Design Intelligence Layer (v2.21, EP-019) — opt-in totale (R.P3).
design_intelligence:
  enabled: false             # master switch — dipende da ux_ui.enabled: true
  critic:
    max_iterations: 3
  generator:
    model: null
  dsl:
    required_fields: [INTENT, PROBLEM, RATIONALE, CONSTRAINTS]

# --- opt-in capabilities added by factory-upgrade -> v2.32 (20260713-1123); all disabled, no behavior change ---
models:
  routing:
    tier_fast: claude-haiku-4-5-20251001
    tier_default: claude-sonnet-4-6
    tier_deep: claude-opus-4-8
  overrides: {}

prototyping:
  enabled: false

tavola_rotonda:
  enabled: false

wiki_search:
  enabled: false

capability_formativa:
  enabled: false

content_share:
  enabled: false                              # R.CS2 opt-in
  target_repo: "soli92/soli-frames"
  source_repo_slug: ""                        # obbligatorio se enabled: true
  source_repo: ""                             # formato org/repo
  pat_env: SOLI_FRAMES_PAT
  secret_env: SOLI_FRAMES_DISPATCH_SECRET
  publish_default: draft
  size_limit_kb: 100
  size_warn_kb: 80
  artifact_categories:
    prototype: true
    analytics_report: true
    custom: true
