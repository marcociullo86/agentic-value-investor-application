# nginx production configuration — reverse proxy for vi-app
# [^src: design_&_architecture/decisions/ADR-015-deployment-target-r11.md §Decisione]
# [^src: management/kanban/EP-008-deploy-operativita-produzione/US-026-baseline-target-deploy/TSK-061.md]
#
# TLS profile: Mozilla SSL Configuration Generator — Intermediate
#   https://ssl-config.mozilla.org/#server=nginx&version=1.27&config=intermediate
#
# Prerequisites:
#   - TLS certificate at /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem
#   - TLS private key at /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem
#   - Generate DH params:  openssl dhparam -out /etc/nginx/dhparam.pem 2048
#   - Substitute APP_DOMAIN with real domain before deploying
#
# APP_DOMAIN placeholder: replace "app.example.com" with actual domain.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Client body limit
    client_max_body_size 10M;

    # ── Server block: HTTP → HTTPS redirect ───────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name app.example.com;

        # Let's Encrypt ACME challenge (certbot --webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # All other HTTP traffic → permanent redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Server block: HTTPS ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name app.example.com;

        # ── TLS — Mozilla Intermediate profile ──────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # DH params (generate with: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
        # ssl_dhparam /etc/nginx/dhparam.pem;

        # Intermediate ciphers — TLS 1.2 + 1.3 (Mozilla recommendation)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Proxy global settings ─────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # ── Health check endpoint — fast, no long upstream timeout ───────────
        location = /healthz {
            proxy_pass http://vi-app:8080/actuator/health;
            proxy_connect_timeout 5s;
            proxy_read_timeout    5s;
            proxy_send_timeout    5s;
            access_log off;
        }

        # ── Main application — all traffic to monolite ────────────────────────
        location / {
            proxy_pass http://vi-app:8080;
        }
    }
}
