# Dev-local stack: app + postgres + adminer
# [^src: design_&_architecture/decisions/ADR-009-deployment-target.md §Dev locale]
# [^src: raw/tech_stack.md §Database — PostgreSQL 17 (overrides ADR-009 §5 'postgres:16')]
#
# Usage:
#   cp .env.example .env  &&  edit .env
#   docker compose -f src/docker/docker-compose.yml --env-file src/docker/.env up
#
# The `app` service expects the multi-stage Dockerfile defined in ADR-009 §2.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-value_investing}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-value_investing}"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: vi-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  embeddings-sidecar:
    build:
      context: ../embeddings-sidecar
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
    container_name: vi-embeddings-sidecar
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_MAX_BATCH: "32"
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  app:
    # The Dockerfile (multi-stage build) is described in ADR-009 §2
    # and will be added as part of the deployment TSK.
    image: vi-app:latest
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile
    container_name: vi-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      embeddings-sidecar:
        condition: service_healthy
    # `.env` è l'UNICO entry point per la configurazione runtime: env_file inietta
    # nel container OGNI variabile definita in src/docker/.env (FMP, Anthropic, LLM
    # budget, SEC EDGAR, MFA, Turnstile, HIBP, scheduling, retention log, …) così
    # Spring le legge tutte. Senza questo, solo le var elencate sotto `environment`
    # raggiungerebbero l'app e il resto di .env verrebbe silenziosamente ignorato.
    env_file:
      - .env
    environment:
      # Override SOLO dei valori legati alla topologia della compose-network:
      # hostname dei service (postgres, embeddings-sidecar). Pinati qui così
      # restano coerenti anche se .env contiene host diversi (es. localhost).
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-value_investing}
      EMBEDDINGS_SIDECAR_URL: http://embeddings-sidecar:8001
    ports:
      - "8080:8080"
    # Corpus RAG WIKI (TSK-345): bind-mount read-only in dev così il corpus è
    # aggiornabile e ri-indicizzabile via POST /admin/rag/wiki/reindex senza
    # rebuild dell'immagine. In prod (docker-compose.prod.yml) l'immagine è
    # self-contained (COPY nel Dockerfile) — nessun bind-mount.
    volumes:
      - ../../wiki:/app/wiki:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

# Portainer is intentionally NOT defined here on Windows + Podman:
# podman-compose path-translates the host source of the Podman socket bind
# (/run/user/1000/podman/podman.sock -> /mnt/c/run/user/...), which breaks
# the mount. Run Portainer directly with `podman run`, which preserves the
# VM-internal path. See src/docker/portainer.ps1 (or run the one-liner below).
#
#   podman run -d --name vi-portainer --restart unless-stopped \
#     --network docker_default \
#     -p 9000:9000 -p 9443:9443 \
#     -v /run/user/1000/podman/podman.sock:/var/run/docker.sock \
#     -v portainer-data:/data \
#     portainer/portainer-ce:latest

volumes:
  postgres-data:
    driver: local
