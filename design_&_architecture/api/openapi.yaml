# OpenAPI 3.1 contract — WebApp Value Investing
# Riferimento: design_&_architecture/decisions/ADR-007-api-contract.md
# Generato come SOURCE OF TRUTH del contratto; springdoc-openapi puo' rigenerarlo
# dal codice. Vedi anche endpoints-overview.md per la mappa US -> endpoint.

openapi: 3.1.0
info:
  title: WebApp Value Investing API
  description: |
    REST API per la WebApp Value Investing. Espone analisi quantitative Graham/Buffett
    su titoli quotati USA + watchlist personale.
    Contratto consumato dal frontend Next.js (SPA). Vedi overview architetturale in
    `design_&_architecture/overview.md`.
  version: "1.0.0-MVP"
  contact:
    name: Lead Architect
servers:
  - url: http://localhost:8080
    description: dev locale
  - url: https://api.example.com
    description: prod (placeholder)

tags:
  - name: search
    description: Ricerca e screener (EP-001)
  - name: analysis
    description: Analisi Rule Engine + valutazione (EP-003 + EP-004)
  - name: financials
    description: Dati di bilancio FMP-backed (EP-002)
  - name: historical
    description: Serie storiche per grafici (EP-005)
  - name: moat
    description: Checklist Moat qualitativa (EP-005)
  - name: watchlist
    description: Watchlist utente (EP-006)
  - name: auth
    description: Autenticazione (EP-006)
  - name: ops
    description: Operativi (override DCF, diagnostics)
  - name: top-picks
    description: Top Value Picks classification batch output (EP-012)

paths:
  # ---------------- EP-001 search/screener ----------------
  /api/search:
    get:
      tags: [search]
      summary: Ricerca azienda per ticker/nome (US-001)
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '200':
          description: Lista risultati (anche vuota se nessun match)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultList'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/search/{ticker}:
    get:
      tags: [search]
      summary: Validazione esistenza ticker (US-001)
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Ticker esiste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockProfile'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api/errors/ticker-not-found"
                title: "Ticker not found"
                status: 404
                detail: "Ticker 'ZZZZ' not found on FMP"
                instance: "/api/search/ZZZZ"
                ticker: "ZZZZ"
                timestamp: "2026-05-22T10:00:00Z"

  /api/screener:
    get:
      tags: [search]
      summary: Screener parametrico (US-002)
      parameters:
        - name: marketCap
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [MICRO, SMALL, MID, LARGE, MEGA]
          explode: true
        - name: sector
          in: query
          required: false
          description: Settori GICS (vedi [[vi-07-risoluzione-q002-q003]] §Criteri Q_003)
          schema:
            type: array
            items:
              type: string
              enum:
                - INFORMATION_TECHNOLOGY
                - FINANCIALS
                - HEALTH_CARE
                - CONSUMER_DISCRETIONARY
                - CONSUMER_STAPLES
                - COMMUNICATION_SERVICES
                - INDUSTRIALS
                - ENERGY
                - MATERIALS
                - REAL_ESTATE
                - UTILITIES
          explode: true
        - name: excludeHardToPredict
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Lista candidati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenerResultPage'

  # ---------------- EP-002 financials ----------------
  /api/financials/{ticker}:
    get:
      tags: [financials]
      summary: Dati di bilancio strutturati (US-004 + US-005 + US-006)
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Set bilancio decennale
          headers:
            X-Data-Snapshot-At:
              schema: { type: string, format: date-time }
            X-Data-Stale:
              schema: { type: boolean }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialDataset'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: FMP indisponibile e nessuna cache disponibile (US-006)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ---------------- EP-003 + EP-004 analysis ----------------
  /api/analysis/{ticker}:
    get:
      tags: [analysis]
      summary: Verdetto Rule Engine completo (US-007..013, consumo US-014)
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Risultato Rule Engine
          headers:
            X-Data-Snapshot-At:
              schema: { type: string, format: date-time }
            X-Data-Stale:
              schema: { type: boolean }
            Vary:
              description: Response varies by Origin (CORS) and Authorization (ADR-011)
              schema:
                type: string
                example: "Origin, Authorization"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleEngineResult'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example:
                type: "https://api/errors/ticker-not-found"
                title: "Ticker not found"
                status: 404
                detail: "Ticker 'ZZZZ' not found on FMP"
                instance: "/api/analysis/ZZZZ"
                ticker: "ZZZZ"
                timestamp: "2026-05-22T10:00:00Z"
        '503':
          description: Dati insufficienti per analisi e FMP non raggiungibile
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/dcf-overrides:
    post:
      tags: [ops]
      summary: Forza un metodo DCF per (utente, ticker) (US-012)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DcfOverrideRequest'
      responses:
        '201':
          description: Override creato/aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DcfOverride'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Metodo DCF non applicabile sui dati storici del ticker (US-020 AC#5)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - type: object
                    properties:
                      method:
                        type: string
                        enum: [GREENWALD, FCF_FALLBACK]
                      reason:
                        type: string
                        enum: [PPE_RATIO_HISTORY_INSUFFICIENT, FCF_HISTORY_INSUFFICIENT]
                      availableYears:
                        type: integer
                      requiredYears:
                        type: integer

  /api/dcf-overrides/{ticker}:
    get:
      tags: [ops]
      summary: Override DCF corrente dell'utente per ticker (US-020 AC#1)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Override personale presente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DcfOverride'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Nessun override per (utente, ticker)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
    delete:
      tags: [ops]
      summary: Rimuove override DCF (US-012)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '204': { description: Rimosso }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- EP-024 technical analysis tab ----------------
  /api/analysis/{ticker}/technical:
    get:
      tags: [analysis]
      summary: Payload Technical Analysis tab (EP-024, US-098..US-100)
      description: |
        Restituisce il payload Technical Analysis per il ticker: 6 blocchi
        indicatori deterministici (trend SMA50/200, momentum RSI14 + MACD daily/
        weekly, volatilita' ATR14, volume OBV, livelli structural support/
        resistance, priceContext 52w) + 3 advisor (entry-timing Triple-Screen
        Elder, stopSuggestion Murphy/Elder, positionSizing 2%/6% Rule Elder,
        rewardRiskRatio vs DCF intrinsic value).

        LAYER ADVISORY di timing: NON sostituisce il verdetto VI. Il gate VI
        primario e' applicato dal Riepilogo (US-103) — non da questo endpoint.

        Equity per il position sizing: parametro `equity` query (default 50000).
        Mai persistito server-side (US-100 §"Separazione di responsabilita'").
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - name: equity
          in: query
          required: false
          description: |
            Capitale di riferimento per il calcolo 2%/6% Rule (US-100). Default
            50000 USD. NON viene mai persistito server-side.
          schema:
            type: number
            default: 50000.0
            minimum: 0.01
      responses:
        '200':
          description: Payload Technical Analysis
          headers:
            X-Data-Snapshot-At:
              schema: { type: string, format: date-time }
            Vary:
              description: Response varies by Origin (CORS) and Authorization (ADR-011)
              schema:
                type: string
                example: "Origin, Authorization"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalAnalysisResponse'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: FMP indisponibile
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ---------------- EP-024 Fase 2 — Riepilogo cross-dominio ----------------
  /api/analysis/{ticker}/summary:
    get:
      tags: [analysis]
      summary: Riepilogo cross-dominio VI+TA (EP-024, US-103)
      description: |
        Aggrega verdetto VI (rule engine + MoS + intrinsic value) + Deep
        Analysis (Munger inversion) + Technical Analysis (entry-timing + stop +
        sizing) in una raccomandazione tipata
        `ENTER_NOW / WAIT_FOR_SETUP / AVOID / INSUFFICIENT_DATA`.

        Gate VI primario HARDCODED (ADR-030 §3+§5):
        - `viVerdict = RED_DOMINANT` → MAI ENTER_NOW (sempre AVOID).
        - `deepVerdict = RISCHIO_ESTREMO` → MAI ENTER_NOW (override Munger).
        - `viVerdict = INDETERMINATE_DOMINANT` → INSUFFICIENT_DATA.

        L'LLM (Claude Opus, 1 sola call) genera solo il `rationale.viSummary/
        deepSummary/taSummary`. Il `summaryVerdict` NON e' MAI prodotto dall'LLM.
        Logging gated (EP-020) + LlmBudgetGuard (EP-011 TSK-156).

        Caching per-user su `(userId, ticker, viSnapshot, taSnapshot,
        deepSnapshot)` TTL 24h o invalidazione su nuovo snapshot.

        `warningAntiCopart` presente SOLO quando `viVerdict = GREEN_DOMINANT`
        AND `taVerdict ∈ {WAIT, ENTRY_UNFAVORABLE}` AND
        `summaryVerdict = WAIT_FOR_SETUP` (situazione COPART).
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Payload Summary cross-dominio
          headers:
            X-Data-Snapshot-At:
              schema: { type: string, format: date-time }
            Vary:
              description: Response varies by Origin (CORS) and Authorization (ADR-011 — auth-aware cache)
              schema:
                type: string
                example: "Origin, Authorization"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryVerdictResponse'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: FMP indisponibile
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ---------------- EP-024 Fase 3 — Backtest per-ticker (US-105) ----------------
  /api/analysis/{ticker}/backtest:
    get:
      tags: [analysis]
      summary: Backtest per-ticker (EP-024, US-105)
      description: |
        Ricostruisce il verdetto EP-024 (`ENTER_NOW / WAIT_FOR_SETUP / AVOID`)
        su punti storici con disciplina point-in-time (filingDate per i
        fondamentali, EOD ≤ t per gli indicatori TA) e simula il round-trip
        completo (entry → exit alla prima tra `VI_TARGET` / `STOP_HIT` /
        `HORIZON`). Confronta contro 2 baseline:

        - `VI_ONLY` — entra ad ogni `t` con gate VI positivo, ignorando il
          timing TA (risponde a "comprare appena era a sconto bastava?").
        - `BUY_AND_HOLD` — trade unico sulla finestra.

        `timingEdgePct` = avgReturnPct(EP024) − avgReturnPct(VI_ONLY) e' la
        metrica chiave che giustifica (o smentisce) il layer di timing TA.
        Label: `POSITIVE_EDGE` (> +2pp), `NEUTRAL` (entro ±2pp),
        `NEGATIVE_EDGE` (< -2pp).

        Storico insufficiente → `status = INSUFFICIENT_HISTORY` con
        `insufficientHistoryReason` esplicito; NESSUN backtest parziale
        silenzioso.

        `caveats` SEMPRE presente: `lookAheadResidual` (FMP serve
        fondamentali ristrutturati), `singleTicker`, `notPortfolioPerformance`.

        `equity` opzionale (default 50000): NON e' MAI persistita server-side
        e NON e' parte della chiave di cache (US-105 §"Vincoli di scope"). E'
        un metadato del DTO per il FE che voglia derivare il dollar amount
        lato client. Il backtest opera in % di rendimento, non in valore
        assoluto.

        Caching: per-chiave `(ticker, years, horizonMonths)`, TTL 24h
        (ADR-030 §1).
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - name: years
          in: query
          required: false
          description: |
            Finestra di lookback in anni (US-105 §Endpoint). Default 5; range
            ammesso [1..20]. Lo storico effettivamente disponibile da FMP puo'
            essere inferiore alla richiesta (IPO recente): in quel caso
            `status = INSUFFICIENT_HISTORY`.
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
        - name: horizonMonths
          in: query
          required: false
          description: |
            Orizzonte massimo di holding del round-trip in mesi (US-105 §Endpoint).
            Default 6. Valori ammessi: 1 / 3 / 6 / 12 — un valore diverso causa
            HTTP 400 (validazione dichiarativa, niente clamping silenzioso).
          schema:
            type: integer
            default: 6
            enum: [1, 3, 6, 12]
        - name: equity
          in: query
          required: false
          description: |
            Capitale di riferimento per il calcolo single-trade (riuso semantica
            US-100). Default 50000. NON viene mai persistita server-side e NON
            entra nella chiave di cache. Per il backtest opera solo come
            metadato (non e' usata in nessun calcolo BE).
          schema:
            type: number
            default: 50000.0
            minimum: 0.01
      responses:
        '200':
          description: |
            Payload backtest (status = OK o INSUFFICIENT_HISTORY). `caveats`
            SEMPRE presente.
          headers:
            X-Data-Snapshot-At:
              schema: { type: string, format: date-time }
            Vary:
              description: Response varies by Origin (CORS) and Authorization (ADR-011)
              schema:
                type: string
                example: "Origin, Authorization"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResponse'
        '400':
          description: |
            Parametri non validi (es. `horizonMonths` fuori da {1,3,6,12},
            `years` fuori da [1..20]).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: FMP indisponibile
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ---------------- EP-011 deep analysis ----------------
  /api/analysis/{ticker}/deep:
    get:
      tags: [analysis]
      summary: Deep analysis completa — ROE + rule engine + verdict + Munger + sentiment (US-045, ADR-020)
      description: |
        Orchestrazione deep analysis pipeline: filing ingest → embedding → ROE
        dual-lookback → rule engine 13 ruleId → price action → verdict cascade →
        position sizing. I campi LLM-dependent (mungerReport, newsSentiment) sono
        popolati solo se invoke_llm=true; in default restano null con
        llmStatus="NOT_INVOKED".
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - name: invoke_llm
          in: query
          required: false
          description: |
            Enable LLM-dependent blocks (Munger inversion report, news sentiment).
            Default false — deterministic-only response in < 2s.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Deep analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepAnalysisResponse'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422':
          description: Ticker senza filing SEC disponibili
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - type: object
                    properties:
                      reason:
                        type: string
                        enum: [no_sec_filings]
        '503':
          description: FMP o LLM indisponibile
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - type: object
                    properties:
                      reason:
                        type: string
                        enum: [llm_unavailable, fmp_unavailable]

  /api/analysis/{ticker}/deep/runs:
    post:
      tags: [analysis]
      summary: Avvia un'esecuzione ASINCRONA della deep analysis (US-045)
      description: |
        Avvio fire-and-enqueue della deep analysis pipeline. Risponde 202 Accepted
        immediatamente senza attendere il completamento; l'esecuzione prosegue in
        background (executor @Async) e popola la tabella deep_analysis_run.
        Dedupe: se per il ticker esiste già un run in stato RUNNING, NON ne avvia
        uno nuovo e restituisce il runId di quello in corso. L'esito finale si
        recupera via GET /api/analysis/{ticker}/deep/latest. L'endpoint sincrono
        GET /api/analysis/{ticker}/deep resta disponibile per back-compat.
      parameters:
        - $ref: '#/components/parameters/Ticker'
        - name: invoke_llm
          in: query
          required: false
          description: |
            Enable LLM-dependent blocks (Munger inversion report, news sentiment)
            for the background run. Default false.
          schema: { type: boolean, default: false }
      responses:
        '202':
          description: Run avviato (o run RUNNING esistente riusato per dedupe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepAnalysisRunStatusResponse'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/analysis/{ticker}/deep/latest:
    get:
      tags: [analysis]
      summary: Ultima esecuzione (asincrona) della deep analysis per il ticker (US-045)
      description: |
        Restituisce l'ultima esecuzione persistita in deep_analysis_run per il
        ticker. All'apertura pagina si mostra questo stato senza ri-eseguire la
        pipeline (no auto-rerun). status=NONE quando non esiste ancora alcun run;
        result è popolato (DeepAnalysisResponse) solo quando status=SUCCESS;
        error è popolato solo quando status=FAILED.
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Stato dell'ultima esecuzione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestDeepAnalysisResponse'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/analysis/{ticker}/deep/ingest:
    post:
      tags: [analysis]
      summary: Avvia l'INGEST ASINCRONO dei filing SEC (download + embedding) (US-045)
      description: |
        Avvio fire-and-enqueue dell'indicizzazione: scarica i filing SEC e calcola/
        salva gli embedding, SENZA invocare l'LLM. Risponde 202 Accepted
        immediatamente; l'esecuzione prosegue in background (stesso executor @Async,
        dispatch per kind) e popola la tabella deep_analysis_run con kind=INGEST.
        Idempotente: i filing già presenti in filing_chunks vengono saltati
        (chunksSkipped). Dedupe: se per il ticker esiste già un INGEST in stato
        RUNNING, NON ne avvia uno nuovo e restituisce il runId di quello in corso.
        Gli embedding persistiti sono poi riusati dall'analisi LLM
        (POST .../deep/runs?invoke_llm=true).
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '202':
          description: INGEST avviato (o INGEST RUNNING esistente riusato per dedupe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepAnalysisRunStatusResponse'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/analysis/{ticker}/deep/ingest/latest:
    get:
      tags: [analysis]
      summary: Ultima indicizzazione (INGEST asincrono) dei filing per il ticker (US-045)
      description: |
        Restituisce l'ultimo INGEST persistito in deep_analysis_run (kind=INGEST)
        per il ticker. status=NONE quando non esiste ancora alcun INGEST; summary
        (IngestSummary) è popolato solo quando status=SUCCESS; error solo quando
        status=FAILED.
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Stato dell'ultima indicizzazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestStatusResponse'
        '404':
          description: Ticker non trovato
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/analysis/{ticker}/deep/reset:
    post:
      tags: [analysis]
      summary: Reset distruttivo dei dati deep-analysis del ticker (admin, EP-020)
      description: |
        Cancella cache e dati derivati del ticker (filing_blob, filing_chunks,
        deep_analysis_report, deep_analysis_run, deep_analysis_event_log,
        news_classification, price_action_snapshot) così che una successiva
        analisi riparta da zero. Gated da master password (BCrypt in tabella
        master_password). 403 se la master password è errata.
      parameters:
        - $ref: '#/components/parameters/Ticker'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TickerResetRequest' }
      responses:
        '200':
          description: Reset eseguito; righe cancellate per tabella
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TickerResetResult' }
        '403':
          description: Master password non valida
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ---------------- EP-005 historical + moat ----------------
  /api/historical/{ticker}:
    get:
      tags: [historical]
      summary: Serie storica ricavi e utile netto (US-015)
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Serie temporale fino a 10 anni
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalSeries'

  /api/moat-checklist/{ticker}:
    get:
      tags: [moat]
      summary: Checklist Moat dell'utente per il ticker (US-016)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '200':
          description: Voci Moat (anche vuote)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoatChecklist'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [moat]
      summary: Upsert di una voce Moat (US-016)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoatChecklistEntryRequest'
      responses:
        '200':
          description: Voce salvata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoatChecklistEntry'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- EP-006 auth + watchlist ----------------
  /api/auth/register:
    post:
      tags: [auth]
      summary: Registrazione utente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Utente creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409':
          description: Email gia' registrata
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Login con email/password
      description: |
        Returns an access token in the body. The refresh token is set as an
        httpOnly Secure SameSite=Strict cookie (Path=/api/auth) — it is never
        exposed in the response body (ADR-024 §3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: "refresh_token={value}; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=604800"
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rinnova access token dal cookie httpOnly
      description: |
        Reads the refresh token from the httpOnly cookie (not the request body).
        Returns a new access token and rotates the refresh cookie (ADR-024 §3).
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Token refreshed
          headers:
            Set-Cookie:
              description: "Rotated refresh_token cookie; HttpOnly; Secure; SameSite=Strict; Path=/api/auth"
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Missing refresh_token cookie
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoca il refresh token corrente
      description: |
        Revokes the refresh token in DB and clears the cookie via Max-Age=0 (ADR-024 §3).
      security:
        - bearerAuth: []
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema: { type: string }
      responses:
        '204':
          description: Logged out
          headers:
            Set-Cookie:
              description: "refresh_token=; Max-Age=0 (cookie deleted)"
              schema: { type: string }

  /api/auth/mfa/enroll:
    post:
      tags: [auth-mfa]
      summary: Start MFA enrollment — generate secret + QR + recovery codes (US-081)
      description: |
        Generates a fresh TOTP secret + 8 one-time recovery codes for the
        authenticated user. Recovery codes are returned in plain text ONCE;
        the server stores BCrypt hashes (ADR-025 §4).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrollment material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: MFA already enabled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/auth/mfa/verify:
    post:
      tags: [auth-mfa]
      summary: Activate MFA by proving the user can compute a TOTP code (US-081)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '204':
          description: MFA activated
        '400':
          description: Invalid TOTP code
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: MFA already enabled or no enrollment in progress
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/auth/mfa/challenge:
    post:
      tags: [auth-mfa]
      summary: Complete login MFA challenge with a TOTP code (US-081)
      description: |
        Trades the short-lived `mfaToken` (from /api/auth/login) plus a current
        TOTP code for the regular access token + refresh cookie pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeRequest'
      responses:
        '200':
          description: MFA challenge succeeded
          headers:
            Set-Cookie:
              description: "refresh_token={value}; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=604800"
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Invalid TOTP code
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/mfa/recovery:
    post:
      tags: [auth-mfa]
      summary: Complete login MFA challenge with a one-time recovery code (US-081)
      description: |
        Alternative to TOTP for users who lost access to their authenticator.
        Consumes one of the 8 recovery codes generated at enrollment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRecoveryRequest'
      responses:
        '200':
          description: Recovery succeeded
          headers:
            Set-Cookie:
              description: "refresh_token={value}; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=604800"
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Invalid or already-used recovery code
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/mfa:
    delete:
      tags: [auth-mfa]
      summary: Disable MFA after re-asserting identity with the account password (US-081)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
      responses:
        '204':
          description: MFA disabled
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: MFA was not enabled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/watchlist:
    get:
      tags: [watchlist]
      summary: Watchlist personale (US-017)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Watchlist con items + ultima evaluate per ticker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/watchlist/items:
    post:
      tags: [watchlist]
      summary: Aggiunge un ticker alla watchlist (US-017)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistItemRequest'
      responses:
        '200':
          description: Aggiunto (o gia' presente — idempotente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistItem'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Ticker inesistente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/watchlist/items/{ticker}:
    delete:
      tags: [watchlist]
      summary: Rimuove ticker dalla watchlist (US-017)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ticker'
      responses:
        '204': { description: Rimosso }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- EP-012 top value picks ----------------
  /api/top-picks:
    get:
      tags: [top-picks]
      summary: Top Value Picks classification — daily batch output (US-050)
      description: |
        Lista paginata della classifica giornaliera prodotta dal job @Scheduled
        (cron 02:00 UTC). Endpoint pubblico (no auth). Se `date` è omessa, il
        service risolve l'ultima `run_date` disponibile (sort DESC). Se non
        esistono ancora run (DB vuoto o primo deploy) → 200 con `total=0`.
        Filtri opzionali: `verdict` (match esatto), `sector` (substring case-
        insensitive lato app), `min_mos` (margin_of_safety ≥ soglia).
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: "Run date (YYYY-MM-DD). Default: latest available."
        - name: verdict
          in: query
          required: false
          schema:
            type: string
            enum: [APPROVATO, APPROVATO_PANIC_BUY, WATCHLIST]
        - name: sector
          in: query
          required: false
          schema: { type: string }
          description: "Substring case-insensitive su entity.sector"
        - name: min_mos
          in: query
          required: false
          schema: { type: number, format: double }
          description: "Soglia minima margin_of_safety"
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Lista paginata top picks
          headers:
            Cache-Control:
              schema: { type: string }
              description: "public, max-age=3600"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopPicksPageResponse'
        '400':
          description: Validation error (date malformata o in futuro, size out-of-range)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/top-picks/run:
    post:
      tags: [top-picks]
      summary: Trigger manuale del batch Top Value Picks
      description: |
        Fire-and-forget: avvia il job TopValuePicksJob in background e risponde
        immediatamente con 202 Accepted. Se un run è già in corso, risponde 409 Conflict.
      responses:
        '202':
          description: Job avviato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: started }
                  startedAt: { type: string, format: date-time }
                  message: { type: string }
                required: [status, message]
        '409':
          description: Un run è già in corso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: already_running }
                  startedAt: { type: string, format: date-time, nullable: true }
                  message: { type: string }
                required: [status, message]

  /api/top-picks/run/cancel:
    post:
      tags: [top-picks]
      summary: Blocco manuale del batch Top Value Picks in corso
      description: |
        Richiede la cancellazione cooperativa del run manuale in flight. Il job
        controlla il flag al confine di ogni ticker e si ferma alla prossima
        iterazione, lasciando intatti i top picks del giorno già presenti (run
        log → ABORTED). Risponde 202 se un blocco è stato registrato, 409 se non
        c'è nessun run da bloccare.
      responses:
        '202':
          description: Richiesta di blocco registrata
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: cancellation_requested }
                  startedAt: { type: string, format: date-time, nullable: true }
                  message: { type: string }
                required: [status, message]
        '409':
          description: Nessun run in corso da bloccare
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not_running }
                  startedAt: { type: string, format: date-time, nullable: true }
                  message: { type: string }
                required: [status, message]

  /api/top-picks/run/status:
    get:
      tags: [top-picks]
      summary: Stato del run manuale (liveness probe)
      description: |
        Probe leggera per la UI: indica se un run manuale è attualmente in
        corso, così la homepage può mostrare il controllo giusto (Lancia vs
        Blocca) al mount e accorgersi quando il batch termina.
      responses:
        '200':
          description: Stato corrente del run manuale
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  startedAt: { type: string, format: date-time, nullable: true }
                required: [running]

components:
  parameters:
    Ticker:
      name: ticker
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 10
        pattern: '^[A-Za-z0-9.\-]{1,10}$'
      description: Ticker simbolo (case-insensitive, normalizzato uppercase)

  responses:
    BadRequest:
      description: Richiesta non valida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Autenticazione mancante o invalida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details; extension members al top-level (ADR-012).
      properties:
        type:    { type: string, format: uri }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }
        instance: { type: string }
        ticker:    { type: string, description: "Extension — ticker correlato" }
        timestamp: { type: string, format: date-time, description: "Extension — istante risposta" }
        requestId: { type: string, description: "Extension — correlazione X-Request-Id" }
        reason:    { type: string, description: "Extension — codice motivo dominio" }

    Signal:
      type: string
      enum: [GREEN, YELLOW, RED, INDETERMINATE, NOT_APPLICABLE, NOT_CALCULABLE]

    StockProfile:
      type: object
      required: [ticker, companyName]
      properties:
        ticker:        { type: string }
        companyName:   { type: string }
        sector:        { type: string, nullable: true }
        industry:      { type: string, nullable: true }
        marketCapUsd:  { type: number, nullable: true }
        currentPrice:  { type: number, nullable: true }
        dataSnapshotAt: { type: string, format: date-time, nullable: true }

    SearchResultItem:
      type: object
      required: [ticker, companyName]
      properties:
        ticker:       { type: string }
        companyName:  { type: string }
        sector:       { type: string, nullable: true }
        marketCapUsd: { type: number, nullable: true }

    SearchResultList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResultItem' }

    ScreenerResultPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResultItem' }
        nextCursor:
          type: string
          nullable: true

    YearlyFinancials:
      type: object
      properties:
        fiscalYear:                    { type: integer }
        revenue:                       { type: number, nullable: true }
        netIncome:                     { type: number, nullable: true }
        eps:                           { type: number, nullable: true }
        bookValuePerShare:             { type: number, nullable: true }
        roe:                           { type: number, nullable: true }
        roic:                          { type: number, nullable: true }
        grossMargin:                   { type: number, nullable: true }
        netMargin:                     { type: number, nullable: true }
        currentRatio:                  { type: number, nullable: true }
        longTermDebt:                  { type: number, nullable: true }
        totalCapex:                    { type: number, nullable: true }
        operatingCashFlow:             { type: number, nullable: true }
        depreciationAndAmortization:   { type: number, nullable: true }
        nonCashCharges:                { type: number, nullable: true }
        grossPpe:                      { type: number, nullable: true }

    FinancialDataset:
      type: object
      required: [ticker, years, dataSnapshotAt, isStale]
      properties:
        ticker:         { type: string }
        years:
          type: array
          items: { $ref: '#/components/schemas/YearlyFinancials' }
        dataSnapshotAt: { type: string, format: date-time }
        isStale:        { type: boolean }
        staleReason:    { type: string, nullable: true }

    RuleSignal:
      description: |
        Esito atomico di una singola regola del Rule Engine per un ticker.
        Union type discriminato (OpenAPI 3.1 `oneOf` + `discriminator` su `ruleId`)
        introdotto da EP-021 / US-093 / TSK-311 (ADR-028).
        Ogni sotto-schema espone i metadati strutturati specifici della rule
        (es. `revenueLatest`/`thresholdUsd` per `SIZE_LATEST`, `yearsPositive`/`lossYears`
        per `EARNINGS_STABILITY_10Y`); i campi legacy `observedValue`/`rationale`/`threshold`
        restano nel payload `deprecated: true` per la finestra di transizione R+1/R+2
        (rimozione a R+3, ADR-028 §8).
        L'x-extension `x-buffett-quality` raggruppa le 7 regole Buffett-leaning (EP-003).
        L'x-extension `x-graham-defensive` raggruppa le 6 regole Graham defensive (EP-010).
      oneOf:
        - $ref: '#/components/schemas/RuleSignalSize'
        - $ref: '#/components/schemas/RuleSignalEarningsStability10y'
        - $ref: '#/components/schemas/RuleSignalEpsGrowth10y'
        - $ref: '#/components/schemas/RuleSignalPe3yAvg'
        - $ref: '#/components/schemas/RuleSignalPbLatest'
        - $ref: '#/components/schemas/RuleSignalDividendContinuity20y'
        - $ref: '#/components/schemas/RuleSignalRoe10yAvg'
        - $ref: '#/components/schemas/RuleSignalRoic10yAvg'
        - $ref: '#/components/schemas/RuleSignalGrossMargin10yAvg'
        - $ref: '#/components/schemas/RuleSignalNetMargin10yAvg'
        - $ref: '#/components/schemas/RuleSignalCurrentRatioLatest'
        - $ref: '#/components/schemas/RuleSignalDebtToIncomeLatest'
        - $ref: '#/components/schemas/RuleSignalCapexIntensity10yAvg'
        - $ref: '#/components/schemas/RuleSignalNcavLatest'
        - $ref: '#/components/schemas/RuleSignalNetNetRatio'
      discriminator:
        propertyName: ruleId
        mapping:
          SIZE_LATEST:               '#/components/schemas/RuleSignalSize'
          EARNINGS_STABILITY_10Y:    '#/components/schemas/RuleSignalEarningsStability10y'
          EPS_GROWTH_10Y:            '#/components/schemas/RuleSignalEpsGrowth10y'
          PE_3Y_AVG:                 '#/components/schemas/RuleSignalPe3yAvg'
          PB_LATEST:                 '#/components/schemas/RuleSignalPbLatest'
          DIVIDEND_CONTINUITY_20Y:   '#/components/schemas/RuleSignalDividendContinuity20y'
          ROE_10Y_AVG:               '#/components/schemas/RuleSignalRoe10yAvg'
          ROIC_10Y_AVG:              '#/components/schemas/RuleSignalRoic10yAvg'
          GROSS_MARGIN_10Y_AVG:      '#/components/schemas/RuleSignalGrossMargin10yAvg'
          NET_MARGIN_10Y_AVG:        '#/components/schemas/RuleSignalNetMargin10yAvg'
          CURRENT_RATIO_LATEST:      '#/components/schemas/RuleSignalCurrentRatioLatest'
          DEBT_TO_INCOME_LATEST:     '#/components/schemas/RuleSignalDebtToIncomeLatest'
          CAPEX_INTENSITY_10Y_AVG:   '#/components/schemas/RuleSignalCapexIntensity10yAvg'
          NCAV_LATEST:               '#/components/schemas/RuleSignalNcavLatest'
          NET_NET_RATIO:             '#/components/schemas/RuleSignalNetNetRatio'
      x-buffett-quality:
        - ROE_10Y_AVG
        - ROIC_10Y_AVG
        - GROSS_MARGIN_10Y_AVG
        - NET_MARGIN_10Y_AVG
        - CURRENT_RATIO_LATEST
        - DEBT_TO_INCOME_LATEST
        - CAPEX_INTENSITY_10Y_AVG
      x-graham-defensive:
        - SIZE_LATEST
        - EARNINGS_STABILITY_10Y
        - EPS_GROWTH_10Y
        - PE_3Y_AVG
        - PB_LATEST
        - DIVIDEND_CONTINUITY_20Y
      x-graham-enterprising:
        - NCAV_LATEST
        - NET_NET_RATIO

    RuleSignalBase:
      type: object
      required: [ruleId, signal]
      description: |
        Campi comuni a tutti i sotto-tipi di RuleSignal. NON usato direttamente come
        contract type — i 13 sotto-schemi lo compongono via `allOf`.
      properties:
        ruleId: { type: string }
        signal: { $ref: '#/components/schemas/Signal' }
        observedValue:
          type: number
          nullable: true
          deprecated: true
          description: "Legacy observed value. Use typed fields per-ruleId. Removed in R+3 (ADR-028 §8)."
        threshold:
          type: string
          deprecated: true
          description: "Legacy human-readable threshold label. Use typed fields per-ruleId. Removed in R+3 (ADR-028 §8)."
        rationale:
          type: string
          deprecated: true
          description: "Legacy human-readable rationale. Use typed fields per-ruleId. Removed in R+3 (ADR-028 §8)."

    # -------------------------------------------------------------------------
    # 13 sotto-schemi tipati (ADR-028 §3 — simmetrici ai sotto-tipi Kotlin)
    # -------------------------------------------------------------------------

    RuleSignalSize:
      description: "Graham §Adequate Size of the Enterprise — soglia $100M revenue latest."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdUsd]
          properties:
            ruleId:        { type: string, enum: [SIZE_LATEST] }
            revenueLatest: { type: number, nullable: true, description: "Revenue ultimo esercizio (USD)" }
            thresholdUsd:  { type: integer, format: int64, description: "Soglia Graham defensive (USD 100M)" }

    RuleSignalEarningsStability10y:
      description: "Graham §Earnings Stability — anni con EPS > 0 sull'orizzonte 10y."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [yearsPositive, yearsAvailable, lossYears]
          properties:
            ruleId:         { type: string, enum: [EARNINGS_STABILITY_10Y] }
            yearsPositive:  { type: integer, description: "Numero anni con EPS positivo" }
            yearsAvailable: { type: integer, description: "Numero anni con dato EPS disponibile (max 10)" }
            lossYears:
              type: array
              items: { type: integer }
              description: "Lista calendar years in cui EPS <= 0"

    RuleSignalEpsGrowth10y:
      description: "Graham §EPS Growth — CAGR EPS su 10 anni."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdPercent]
          properties:
            ruleId:           { type: string, enum: [EPS_GROWTH_10Y] }
            cagrPercent:      { type: number, nullable: true, description: "CAGR EPS 10y in % (es. 5.2)" }
            thresholdPercent: { type: number, description: "Soglia minima CAGR % (Graham >= 33% cumulativo ~= 2.9% annuo)" }
            epsStart:         { type: number, nullable: true, description: "EPS anno iniziale finestra" }
            epsEnd:           { type: number, nullable: true, description: "EPS anno finale finestra" }
            yearStart:        { type: integer, nullable: true, description: "Calendar year anno iniziale" }
            yearEnd:          { type: integer, nullable: true, description: "Calendar year anno finale" }

    RuleSignalPe3yAvg:
      description: |
        Graham §P/E Moderate — media 3y EPS.
        Deviazione ADR-028 §3 ('small adjustment' previsto dall'ADR): adottato
        `thresholdGreen` + `thresholdYellow` invece di un singolo `threshold`,
        perche' (a) la rule ha due soglie semantiche (<=15 GREEN / (15,20] YELLOW
        / >20 RED) e (b) il nome `threshold` collideva con il campo legacy.
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdGreen, thresholdYellow]
          properties:
            ruleId:          { type: string, enum: [PE_3Y_AVG] }
            pe3yAvg:         { type: number, nullable: true, description: "P/E calcolato come price / avg(EPS, 3y)" }
            thresholdGreen:  { type: number, description: "Soglia massima per GREEN (default 15)" }
            thresholdYellow: { type: number, description: "Soglia massima per YELLOW (default 20)" }

    RuleSignalPbLatest:
      description: |
        Graham §P/B Moderate. Deviazione ADR-028 §3 analoga a Pe3yAvg:
        `thresholdGreen` (default 1.5) + `thresholdYellow` (default 3.0).
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdGreen, thresholdYellow]
          properties:
            ruleId:          { type: string, enum: [PB_LATEST] }
            pbLatest:        { type: number, nullable: true, description: "P/B latest = currentPrice / bookValuePerShare" }
            thresholdGreen:  { type: number, description: "Soglia massima per GREEN (default 1.5)" }
            thresholdYellow: { type: number, description: "Soglia massima per YELLOW (default 3.0)" }

    RuleSignalDividendContinuity20y:
      description: "Graham §Dividend Continuity — anni consecutivi di pagamento dividendo."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdYears]
          properties:
            ruleId:            { type: string, enum: [DIVIDEND_CONTINUITY_20Y] }
            consecutiveYears:  { type: integer, nullable: true, description: "Anni consecutivi di dividendo > 0" }
            thresholdYears:    { type: integer, description: "Soglia minima Graham (20 anni)" }

    RuleSignalRoe10yAvg:
      description: "Buffett §Quality — ROE media 10y."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [yearsAvailable, thresholdGreenPercent, thresholdYellowPercent]
          properties:
            ruleId:                  { type: string, enum: [ROE_10Y_AVG] }
            averagePercent:          { type: number, nullable: true, description: "ROE medio % su finestra disponibile" }
            yearsAvailable:          { type: integer, description: "Anni con dato ROE (max 10)" }
            thresholdGreenPercent:   { type: number, description: "Soglia % per GREEN" }
            thresholdYellowPercent:  { type: number, description: "Soglia % per YELLOW" }

    RuleSignalRoic10yAvg:
      description: "Buffett §Quality — ROIC media 10y (schema identico a ROE_10Y_AVG)."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [yearsAvailable, thresholdGreenPercent, thresholdYellowPercent]
          properties:
            ruleId:                  { type: string, enum: [ROIC_10Y_AVG] }
            averagePercent:          { type: number, nullable: true, description: "ROIC medio % su finestra disponibile" }
            yearsAvailable:          { type: integer, description: "Anni con dato ROIC (max 10)" }
            thresholdGreenPercent:   { type: number, description: "Soglia % per GREEN" }
            thresholdYellowPercent:  { type: number, description: "Soglia % per YELLOW" }

    RuleSignalGrossMargin10yAvg:
      description: "Buffett §Pricing Power — gross margin media 10y."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdGreenPercent, thresholdYellowPercent]
          properties:
            ruleId:                  { type: string, enum: [GROSS_MARGIN_10Y_AVG] }
            averagePercent:          { type: number, nullable: true, description: "Gross margin medio %" }
            thresholdGreenPercent:   { type: number, description: "Soglia % per GREEN" }
            thresholdYellowPercent:  { type: number, description: "Soglia % per YELLOW" }

    RuleSignalNetMargin10yAvg:
      description: "Buffett §Pricing Power — net margin media 10y."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdGreenPercent]
          properties:
            ruleId:                  { type: string, enum: [NET_MARGIN_10Y_AVG] }
            averagePercent:          { type: number, nullable: true, description: "Net margin medio %" }
            thresholdGreenPercent:   { type: number, description: "Soglia % per GREEN" }

    RuleSignalCurrentRatioLatest:
      description: "Buffett §Financial Strength — current ratio latest."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdGreen, thresholdYellow]
          properties:
            ruleId:          { type: string, enum: [CURRENT_RATIO_LATEST] }
            ratioLatest:     { type: number, nullable: true, description: "Current ratio = currentAssets / currentLiabilities" }
            thresholdGreen:  { type: number, description: "Soglia minima per GREEN" }
            thresholdYellow: { type: number, description: "Soglia minima per YELLOW" }

    RuleSignalDebtToIncomeLatest:
      description: "Buffett §Financial Strength — debt/income latest. INDETERMINATE se net income <= 0."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdGreen, thresholdYellow, netIncomePositive]
          properties:
            ruleId:             { type: string, enum: [DEBT_TO_INCOME_LATEST] }
            ratioLatest:        { type: number, nullable: true, description: "Long-term debt / net income (anni)" }
            thresholdGreen:     { type: number, description: "Soglia massima per GREEN" }
            thresholdYellow:    { type: number, description: "Soglia massima per YELLOW" }
            netIncomePositive:  { type: boolean, description: "false -> INDETERMINATE (rapporto non significativo)" }

    RuleSignalCapexIntensity10yAvg:
      description: "Buffett §Capital-Light — capex/operatingCashFlow media 10y."
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [thresholdGreenPercent, thresholdYellowPercent]
          properties:
            ruleId:                  { type: string, enum: [CAPEX_INTENSITY_10Y_AVG] }
            averagePercent:          { type: number, nullable: true, description: "Capex intensity media %" }
            thresholdGreenPercent:   { type: number, description: "Soglia massima % per GREEN" }
            thresholdYellowPercent:  { type: number, description: "Soglia massima % per YELLOW" }

    # -------------------------------------------------------------------------
    # EP-023 — Graham Cap.15 Enterprising Investor (NCAV / Net-Net), ADR-029 §2 + §3
    # -------------------------------------------------------------------------

    RuleSignalNcavLatest:
      description: |
        Graham §Cap.15 Enterprising Investor — Net Current Asset Value (informativo).
        Formula: NCAV = totalCurrentAssets − totalLiabilities (passività TOTALI, ADR-029 §1).
        Codifica (ADR-029 §2): dati mancanti → INDETERMINATE; ncavTotal > 0 → GREEN
        (calcolo riuscito; la decisione di acquisto spetta a NET_NET_RATIO);
        ncavTotal ≤ 0 → RED (passivo totale > attivo corrente).
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [ncavTotal, ncavPerShare]
          properties:
            ruleId:        { type: string, enum: [NCAV_LATEST] }
            ncavTotal:     { type: number, nullable: true, description: "Net Current Asset Value totale in USD" }
            ncavPerShare:  { type: number, nullable: true, description: "NCAV per azione in USD" }

    RuleSignalNetNetRatio:
      description: |
        Graham §Cap.15 Enterprising Investor — Net-Net ratio (decisionale GREEN/RED).
        Formula: ratio = priceLatest / ncavPerShare (ADR-029 §1).
        Soglia: 2/3 = 0.6667 con precisione double (ADR-029 §3).
        Codifica: ncavPerShare non calcolabile OR priceLatest null → INDETERMINATE;
        ncavPerShare ≤ 0 → NOT_CALCULABLE (coerente con NCAV_LATEST RED);
        ratio < 0.6667 → GREEN (opportunità net-net Graham);
        ratio ≥ 0.6667 → RED (titolo non net-net).
      allOf:
        - $ref: '#/components/schemas/RuleSignalBase'
        - type: object
          required: [priceLatest, ncavPerShare, ratio, thresholdRatio]
          properties:
            ruleId:         { type: string, enum: [NET_NET_RATIO] }
            priceLatest:    { type: number, nullable: true, description: "Prezzo corrente in USD (da FmpProfileSnapshot, ADR-014)" }
            ncavPerShare:   { type: number, nullable: true, description: "NCAV per azione in USD" }
            ratio:          { type: number, nullable: true, description: "priceLatest / ncavPerShare" }
            thresholdRatio: { type: number, default: 0.6666666666666666, description: "Soglia Graham 2/3" }

    DcfMethod:
      type: string
      enum: [GREENWALD, FCF_FALLBACK, NOT_APPLICABLE]

    DcfMethodSource:
      type: string
      enum: [DEFAULT_POLICY, USER_OVERRIDE]
      description: |
        Indica se il metodo DCF applicato proviene dalla default-policy del Rule Engine
        o da un override personale dell'utente autenticato (US-020).

    RuleEngineResult:
      type: object
      required: [ticker, evaluatedAt, signals, mosSignal, dcfMethodSource, dataSnapshotAt]
      properties:
        ticker:                  { type: string }
        evaluatedAt:             { type: string, format: date-time }
        signals:
          type: array
          items: { $ref: '#/components/schemas/RuleSignal' }
        grahamNumber:            { type: number, nullable: true }
        dcfIntrinsicValue:       { type: number, nullable: true }
        dcfMethod:               { $ref: '#/components/schemas/DcfMethod' }
        dcfMethodSource:         { $ref: '#/components/schemas/DcfMethodSource' }
        mosSignal:               { $ref: '#/components/schemas/Signal' }
        currentPriceAtEval:      { type: number, nullable: true }
        dataSnapshotAt:          { type: string, format: date-time }
        isStale:                 { type: boolean }
        contextFlags:
          # EP-013 Mr. Market Context Flags (US-056 + US-057). Sezione advisory
          # additiva, DISTINTA dai 13 `signals` del Rule Engine. Non breaking.
          allOf:
            - $ref: '#/components/schemas/ContextFlags'
          nullable: true

    MrMarketRsiSignal:
      type: string
      enum: [OVERSOLD, NEUTRAL, OVERBOUGHT, INDETERMINATE]
      description: |
        Advisory signal RSI 14-day (EP-013 / US-056). NON contribuisce alla MoS
        né ai 13 rule signal. Soglie standard di settore (Wilder): <30 OVERSOLD,
        >70 OVERBOUGHT, in-between NEUTRAL. INDETERMINATE per dato mancante.

    MrMarketRsiFlag:
      type: object
      required: [flag, periodLength, timeframe]
      properties:
        flag:           { $ref: '#/components/schemas/MrMarketRsiSignal' }
        rsiLatest:      { type: number, nullable: true, description: "Valore RSI 0..100" }
        rsiTimestamp:   { type: string, nullable: true, description: "ISO yyyy-MM-dd HH:mm:ss da FMP" }
        periodLength:   { type: integer, default: 14 }
        timeframe:      { type: string, default: "1day" }

    LongTermTrendSignal:
      type: string
      enum: [BELOW_TREND, NEAR_TREND, ABOVE_TREND, INDETERMINATE]
      description: |
        Advisory signal long-term trend (EP-013 / US-057) basato su SMA200.
        Soglie asimmetriche: pct < -5% BELOW_TREND, pct > +20% ABOVE_TREND,
        else NEAR_TREND. INDETERMINATE per dato mancante.

    LongTermTrendFlag:
      type: object
      required: [flag, periodLength, timeframe]
      properties:
        flag:           { $ref: '#/components/schemas/LongTermTrendSignal' }
        sma200Latest:   { type: number, nullable: true, description: "SMA200 in $" }
        currentPrice:   { type: number, nullable: true }
        priceVsSmaPct:  { type: number, nullable: true, description: "(price - sma) / sma, es. -0.20 = -20%" }
        smaTimestamp:   { type: string, nullable: true }
        periodLength:   { type: integer, default: 200 }
        timeframe:      { type: string, default: "1day" }

    ContextFlags:
      type: object
      description: |
        Container advisory Mr. Market signals (EP-013). DISTINTO dai 13 rule signal:
        questi flag NON contribuiscono alla MoS, sono solo input per la UI badge.
        Tutti i field nullable per backfill incrementale e additività non-breaking.
      properties:
        mrMarketRsi:
          allOf:
            - $ref: '#/components/schemas/MrMarketRsiFlag'
          nullable: true
        longTermTrend:
          allOf:
            - $ref: '#/components/schemas/LongTermTrendFlag'
          nullable: true

    DcfOverrideRequest:
      type: object
      required: [ticker, forcedMethod]
      properties:
        ticker:        { type: string }
        forcedMethod:
          type: string
          enum: [GREENWALD, FCF_FALLBACK]

    DcfOverride:
      type: object
      required: [ticker, forcedMethod, createdAt]
      properties:
        ticker:        { type: string }
        forcedMethod:
          type: string
          enum: [GREENWALD, FCF_FALLBACK]
        createdAt:     { type: string, format: date-time }

    HistoricalSeriesPoint:
      type: object
      properties:
        fiscalYear: { type: integer }
        revenue:    { type: number, nullable: true }
        netIncome:  { type: number, nullable: true }
        isMissing:  { type: boolean }

    HistoricalSeries:
      type: object
      required: [ticker, points]
      properties:
        ticker: { type: string }
        points:
          type: array
          items: { $ref: '#/components/schemas/HistoricalSeriesPoint' }
        dataSnapshotAt: { type: string, format: date-time }

    MoatType:
      type: string
      enum: [INTANGIBLE_ASSETS, SWITCHING_COSTS, NETWORK_EFFECT, COST_ADVANTAGE]

    MoatStatus:
      type: string
      enum: [PRESENT, PARTIAL, ABSENT]

    MoatChecklistEntry:
      type: object
      required: [moatType, status, updatedAt]
      properties:
        moatType:  { $ref: '#/components/schemas/MoatType' }
        status:    { $ref: '#/components/schemas/MoatStatus' }
        note:      { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }

    MoatChecklistEntryRequest:
      type: object
      required: [moatType, status]
      properties:
        moatType: { $ref: '#/components/schemas/MoatType' }
        status:   { $ref: '#/components/schemas/MoatStatus' }
        note:     { type: string, nullable: true }

    MoatChecklist:
      type: object
      required: [ticker, entries]
      properties:
        ticker:  { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/MoatChecklistEntry' }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:       { type: string, format: email }
        password:    { type: string, minLength: 12 }
        displayName: { type: string, nullable: true }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    AccessTokenResponse:
      type: object
      description: |
        Short-lived access token. The refresh token is transported via
        httpOnly cookie (ADR-024 §3) — never in the response body.
      required: [accessToken, expiresInSeconds]
      properties:
        accessToken:      { type: string, description: "JWT access token (Bearer)" }
        expiresInSeconds: { type: integer, description: "Token lifetime in seconds", example: 900 }

    MfaEnrollmentResponse:
      type: object
      description: |
        Initial enrollment material. Recovery codes are returned ONCE in plain
        text; the server stores only BCrypt hashes (ADR-025 §4).
      required: [secret, qrCodeUri, recoveryCodes]
      properties:
        secret:        { type: string, description: "Base32 TOTP shared secret (RFC 6238)" }
        qrCodeUri:     { type: string, description: "otpauth:// provisioning URI to render as QR code" }
        recoveryCodes:
          type: array
          description: "8 plain-text recovery codes, one-time consumable"
          items: { type: string }

    MfaVerifyRequest:
      type: object
      required: [totpCode]
      properties:
        totpCode: { type: string, description: "6-digit TOTP code from the authenticator app" }

    MfaChallengeRequest:
      type: object
      required: [mfaToken, totpCode]
      properties:
        mfaToken: { type: string, description: "Short-lived JWT issued by /api/auth/login" }
        totpCode: { type: string, description: "6-digit TOTP code from the authenticator app" }

    MfaRecoveryRequest:
      type: object
      required: [mfaToken, recoveryCode]
      properties:
        mfaToken:     { type: string, description: "Short-lived JWT issued by /api/auth/login" }
        recoveryCode: { type: string, description: "Plain-text recovery code (dashes optional)" }

    MfaDisableRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, description: "Account password — re-asserts identity before disabling MFA" }

    UserProfile:
      type: object
      required: [id, email]
      properties:
        id:          { type: string, format: uuid }
        email:       { type: string }
        displayName: { type: string, nullable: true }
        createdAt:   { type: string, format: date-time }

    WatchlistItemRequest:
      type: object
      required: [ticker]
      properties:
        ticker: { type: string }

    WatchlistItem:
      type: object
      required: [ticker, addedAt]
      properties:
        ticker:           { type: string }
        companyName:      { type: string, nullable: true }
        sector:           { type: string, nullable: true }
        addedAt:          { type: string, format: date-time }
        lastEvaluation:
          $ref: '#/components/schemas/RuleEngineResult'

    Watchlist:
      type: object
      required: [id, name, items]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        isDefault: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/WatchlistItem' }

    # ---- EP-011 Deep Analysis (ADR-020, US-045) ----

    VerdictClass:
      type: string
      enum:
        - APPROVATO_PANIC_BUY
        - APPROVATO
        - WATCHLIST
        - BOCCIATO_NUMERICO
        - BOCCIATO_QUALITATIVO
        - BOCCIATO_VALUE_TRAP

    LivelloRischio:
      type: string
      enum:
        - RISCHIO_BASSO
        - RISCHIO_MODERATO
        - RISCHIO_ALTO
        - RISCHIO_ESTREMO

    SentimentClass:
      type: string
      enum:
        - TEMPORARY_PANIC
        - STRUCTURAL_DAMAGE
        - NEUTRAL

    LlmStatus:
      type: string
      enum: [INVOKED, NOT_INVOKED, CACHE_HIT]

    RoeBlock:
      type: object
      required: [fiveYearDataPoints, tenYearDataPoints]
      description: |
        Dual-lookback ROE metrics (ADR-020). Both 5-year (growth/turnaround
        signal) and 10-year (Graham defensive stability signal) averages
        exposed side-by-side. Nullable avg fields handle IPO-recent tickers.
      properties:
        fiveYearAvg:
          type: number
          nullable: true
          description: 5-year average ROE as fraction (e.g. 0.265 = 26.5%)
        tenYearAvg:
          type: number
          nullable: true
          description: 10-year average ROE as fraction (e.g. 0.312 = 31.2%)
        fiveYearDataPoints:
          type: integer
          minimum: 0
          maximum: 5
        tenYearDataPoints:
          type: integer
          minimum: 0
          maximum: 10

    PriceActionBlock:
      type: object
      required: [panicDiscount, deteriorationWarning, seriesDays]
      description: Price action snapshot — 52-week range, moving averages, signals.
      properties:
        priceNow:              { type: number, nullable: true }
        max52w:                { type: number, nullable: true }
        min52w:                { type: number, nullable: true }
        drawdownPct:           { type: number, nullable: true, description: "Drawdown from 52w high as fraction" }
        trend3mPct:            { type: number, nullable: true, description: "3-month price trend as fraction" }
        ma50:                  { type: number, nullable: true }
        ma200:                 { type: number, nullable: true }
        panicDiscount:         { type: boolean, description: "True if price is in panic-buy territory" }
        deteriorationWarning:  { type: boolean, description: "True if price trend suggests structural deterioration" }
        seriesDays:            { type: integer, description: "Number of trading days in the underlying series" }

    VerdictBlock:
      type: object
      required: [verdettoClasse, positionSizePct, partialBasis, motivazioneAggregata, ruleCountGreen, ruleCountYellow, ruleCountRed, livelloRischio, newsSentimentDominante]
      description: Verdict cascade output (US-044).
      properties:
        verdettoClasse:          { $ref: '#/components/schemas/VerdictClass' }
        positionSizePct:         { type: number, description: "Suggested position size as percentage" }
        partialBasis:            { type: boolean, description: "True when LLM blocks were not invoked" }
        motivazioneAggregata:    { type: string, description: "Aggregated human-readable motivation" }
        ruleCountGreen:          { type: integer }
        ruleCountYellow:         { type: integer }
        ruleCountRed:            { type: integer }
        livelloRischio:          { $ref: '#/components/schemas/LivelloRischio' }
        newsSentimentDominante:  { $ref: '#/components/schemas/SentimentClass' }

    PositionSizeBlock:
      type: object
      required: [recommendedPct, rangeLow, rangeHigh, basisVerdict, marginOfSafetyPct, disclaimer]
      description: Kelly-inspired position sizing recommendation.
      properties:
        recommendedPct:    { type: number, description: "Central recommended allocation percentage" }
        rangeLow:          { type: number, description: "Conservative bound of allocation range" }
        rangeHigh:         { type: number, description: "Aggressive bound of allocation range" }
        basisVerdict:      { $ref: '#/components/schemas/VerdictClass' }
        marginOfSafetyPct: { type: number, description: "Margin of safety percentage used in sizing" }
        disclaimer:        { type: string }

    InversionItem:
      type: object
      required: [testo, chunkIndex]
      description: Single Munger inversion finding tied to a filing chunk.
      properties:
        testo:      { type: string, description: "Inversion finding text" }
        chunkIndex: { type: integer, description: "Index of the source filing chunk" }

    MungerReportBlock:
      type: object
      required: [livelloRischio, rischiPrincipali, puntiDiForza, segnaliRecenti10Q, filingComboHash, llmCallsCount]
      description: Munger inversion LLM report (US-041). Null when invoke_llm=false.
      properties:
        livelloRischio:    { $ref: '#/components/schemas/LivelloRischio' }
        sintesi:           { type: string, nullable: true, description: "Narrative LLM synthesis of the risk level (US-089); null for legacy cached reports" }
        rischiPrincipali:
          type: array
          items: { $ref: '#/components/schemas/InversionItem' }
        puntiDiForza:
          type: array
          items: { $ref: '#/components/schemas/InversionItem' }
        segnaliRecenti10Q:
          type: array
          items: { $ref: '#/components/schemas/InversionItem' }
        filingComboHash:   { type: string, description: "Hash of the filing combination used for cache keying" }
        llmCallsCount:     { type: integer }

    NewsSentimentBlock:
      type: object
      required: [total, panicCount, structuralCount, neutralCount, dominantClass, items]
      description: News sentiment classification summary (US-042). Null when invoke_llm=false.
      properties:
        total:           { type: integer }
        panicCount:      { type: integer }
        structuralCount: { type: integer }
        neutralCount:    { type: integer }
        dominantClass:   { $ref: '#/components/schemas/SentimentClass' }
        items:
          type: array
          description: "Notizie analizzate (set curato): titolo + testo + classe + motivazione (US-091)"
          items: { $ref: '#/components/schemas/NewsItem' }

    NewsItem:
      type: object
      required: [sentimentClass]
      description: Singola notizia analizzata nel Sentiment News (US-091).
      properties:
        headline:      { type: string, nullable: true }
        textExcerpt:   { type: string, nullable: true, description: "Snippet/testo della notizia" }
        sentimentClass: { $ref: '#/components/schemas/SentimentClass' }
        motivazione:   { type: string, nullable: true, description: "Motivazione LLM della classificazione" }
        url:           { type: string, nullable: true }

    FilingRef:
      type: object
      required: [accessionNumber, formType, filingDate]
      description: Reference to a SEC filing used during deep analysis.
      properties:
        accessionNumber: { type: string }
        formType:        { type: string, description: "e.g. 10-K, 10-Q" }
        filingDate:      { type: string, description: "Filing date (YYYY-MM-DD)" }

    DeepAnalysisResponse:
      type: object
      required: [ticker, generatedAt, roe, priceAction, ruleEngineResults, verdict, filingsUsed, llmStatus, llmCalls, totalDurationMs]
      description: |
        Full response payload for GET /api/analysis/{ticker}/deep (US-045).
        Deterministic fields (roe, priceAction, ruleEngineResults, verdict,
        filingsUsed) are always populated. LLM-dependent fields (mungerReport,
        newsSentiment) are null when invoke_llm=false. positionSize is null
        when verdict is BOCCIATO_*.
      properties:
        ticker:      { type: string }
        generatedAt: { type: string, format: date-time }
        roe:
          $ref: '#/components/schemas/RoeBlock'
        priceAction:
          $ref: '#/components/schemas/PriceActionBlock'
        ruleEngineResults:
          type: array
          items: { $ref: '#/components/schemas/RuleSignal' }
          description: All 13 rule engine signals (7 Buffett + 6 Graham defensive)
        verdict:
          $ref: '#/components/schemas/VerdictBlock'
        positionSize:
          $ref: '#/components/schemas/PositionSizeBlock'
          nullable: true
          description: Position sizing recommendation, null for BOCCIATO verdicts
        filingsUsed:
          type: array
          items: { $ref: '#/components/schemas/FilingRef' }
        mungerReport:
          $ref: '#/components/schemas/MungerReportBlock'
          nullable: true
          description: Munger inversion LLM report, null when invoke_llm=false
        newsSentiment:
          $ref: '#/components/schemas/NewsSentimentBlock'
          nullable: true
          description: News sentiment classification, null when invoke_llm=false
        llmStatus:   { $ref: '#/components/schemas/LlmStatus' }
        llmCalls:    { type: integer, description: "Number of LLM API calls made" }
        totalDurationMs: { type: integer, format: int64, description: "Total pipeline duration in milliseconds" }

    # ---- EP-011 Deep Analysis — async run model (US-045, 2026-05-29) ----

    DeepAnalysisRunStatus:
      type: string
      description: Stato di un'esecuzione asincrona della deep analysis.
      enum: [RUNNING, SUCCESS, FAILED]

    LatestDeepAnalysisStatus:
      type: string
      description: |
        Stato dell'ultima esecuzione esposto da GET .../deep/latest. Aggiunge
        NONE rispetto a DeepAnalysisRunStatus per il caso "nessun run esistente".
      enum: [RUNNING, SUCCESS, FAILED, NONE]

    RunError:
      type: object
      required: [reason, message]
      description: Dettaglio errore di un run FAILED. reason = codice dominio (RFC 9457).
      properties:
        reason:  { type: string, description: "Codice motivo dominio (es. no_sec_filings, llm_unavailable, not_indexed). not_indexed = analisi LLM richiesta su un ticker mai indicizzato (lanciare prima POST .../deep/ingest)." }
        message: { type: string }

    DeepAnalysisRunKind:
      type: string
      description: |
        Tipo di operazione async sulla tabella deep_analysis_run (US-045,
        2026-05-30). INGEST = download filing SEC + embedding (no LLM); ANALYSIS =
        verdetto/analisi che riusa gli embedding persistiti.
      enum: [INGEST, ANALYSIS]

    TickerResetRequest:
      type: object
      required: [masterPassword]
      description: Richiesta di reset distruttivo dati deep-analysis di un ticker (EP-020).
      properties:
        masterPassword: { type: string, description: "Master password admin" }

    TickerResetResult:
      type: object
      required: [ticker, deletedByTable, totalDeleted]
      description: Esito del reset — righe cancellate per tabella.
      properties:
        ticker: { type: string }
        deletedByTable:
          type: object
          additionalProperties: { type: integer }
          description: "Righe cancellate per ciascuna tabella impattata"
        totalDeleted: { type: integer }

    DeepAnalysisRunStatusResponse:
      type: object
      required: [runId, ticker, status, invokeLlm, kind]
      description: |
        Risposta 202 di POST /api/analysis/{ticker}/deep/runs (kind=ANALYSIS) e di
        POST /api/analysis/{ticker}/deep/ingest (kind=INGEST, invokeLlm=false). In
        caso di dedupe runId è quello del run RUNNING già in corso per il ticker.
      properties:
        runId:     { type: string, format: uuid }
        ticker:    { type: string }
        status:    { $ref: '#/components/schemas/DeepAnalysisRunStatus' }
        invokeLlm: { type: boolean }
        kind:      { $ref: '#/components/schemas/DeepAnalysisRunKind' }

    IngestSummary:
      type: object
      required: [filingsTotal, chunksIndexed, chunksSkipped, indexedAt]
      description: |
        Esito di un INGEST riuscito. chunksSkipped > 0 quando alcuni filing erano
        già indicizzati (skip idempotente, nessun ri-embedding).
      properties:
        filingsTotal:  { type: integer, description: "Filing SEC considerati" }
        chunksIndexed: { type: integer, description: "Chunk nuovi calcolati ed embeddati" }
        chunksSkipped: { type: integer, description: "Chunk saltati perché già presenti in filing_chunks" }
        indexedAt:     { type: string, format: date-time, description: "Timestamp del completamento indicizzazione" }

    IngestStatusResponse:
      type: object
      required: [ticker, status]
      description: |
        Risposta 200 di GET /api/analysis/{ticker}/deep/ingest/latest. runId/
        requestedAt/completedAt sono null quando status=NONE. summary
        (IngestSummary) è valorizzato solo quando status=SUCCESS; error solo
        quando status=FAILED.
      properties:
        ticker:      { type: string }
        status:      { $ref: '#/components/schemas/LatestDeepAnalysisStatus' }
        runId:
          type: string
          format: uuid
          nullable: true
        requestedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        summary:
          allOf:
            - $ref: '#/components/schemas/IngestSummary'
          nullable: true
          description: Esito indicizzazione, presente solo quando status=SUCCESS
        error:
          allOf:
            - $ref: '#/components/schemas/RunError'
          nullable: true
          description: Dettaglio errore, presente solo quando status=FAILED

    LatestDeepAnalysisResponse:
      type: object
      required: [ticker, status, invokeLlm]
      description: |
        Risposta 200 di GET /api/analysis/{ticker}/deep/latest. runId/requestedAt/
        completedAt sono null quando status=NONE. result (DeepAnalysisResponse) è
        valorizzato solo quando status=SUCCESS; error solo quando status=FAILED.
      properties:
        ticker:      { type: string }
        status:      { $ref: '#/components/schemas/LatestDeepAnalysisStatus' }
        runId:
          type: string
          format: uuid
          nullable: true
        invokeLlm:   { type: boolean }
        requestedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        result:
          allOf:
            - $ref: '#/components/schemas/DeepAnalysisResponse'
          nullable: true
          description: Payload completo, presente solo quando status=SUCCESS
        error:
          allOf:
            - $ref: '#/components/schemas/RunError'
          nullable: true
          description: Dettaglio errore, presente solo quando status=FAILED

    # ---------------- EP-024 technical analysis tab (US-098..US-100) ----------------

    TrendClassification:
      type: string
      enum: [UPTREND, SIDEWAYS, DOWNTREND, INDETERMINATE]
      description: |
        Classificazione deterministica del trend primario daily (US-098).
        UPTREND: prezzo > SMA50 > SMA200 con slope SMA200 positivo.
        DOWNTREND: prezzo < SMA50 < SMA200 con slope SMA200 negativo.
        SIDEWAYS: ogni altra combinazione.
        INDETERMINATE: storico < 200 sedute.

    SupportType:
      type: string
      enum: [SWING_LOW, SWING_HIGH, RETRACEMENT_33, RETRACEMENT_50, RETRACEMENT_66]
      description: Tipo del livello structural (Murphy §Page 85, Dow Theory).

    LevelConfidence:
      type: string
      enum: [LOW, MEDIUM, HIGH]
      description: Affidabilita' del livello (HIGH = swing prominente; LOW = retracement derivato).

    EntryTimingVerdict:
      type: string
      enum: [ENTRY_FAVORABLE, ENTRY_NEUTRAL, ENTRY_UNFAVORABLE, WAIT, INDETERMINATE]
      description: |
        Verdetto Triple-Screen Elder (US-099): ENTRY_FAVORABLE / ENTRY_NEUTRAL /
        ENTRY_UNFAVORABLE / WAIT (con reentryCondition) / INDETERMINATE.

    ReentryConditionCode:
      type: string
      enum: [RSI_BELOW_50, PRICE_ABOVE_SMA200_WITH_VOLUME, PULLBACK_TO_SUPPORT_50PCT]
      description: |
        Codice machine-readable della condizione che sblocca la rivalutazione
        del WAIT (US-099).

    StopType:
      type: string
      enum: [SUPPORT_BASED, SMA200_BASED, ATR_BASED, NOT_CALCULABLE]
      description: |
        Tipo di ancoraggio dello stop (US-100, priorita' decrescente):
        SUPPORT_BASED (Murphy §Page 82) > SMA200_BASED > ATR_BASED (Elder) >
        NOT_CALCULABLE (nessun candidato applicabile).

    PositionSizingWarning:
      type: string
      enum: [POSITION_EXCEEDS_EQUITY]
      description: |
        Warning del 2% Rule sizing (US-100). POSITION_EXCEEDS_EQUITY: stop molto
        stretto → la size teorica supera l'equity; le shares sono cappate a
        floor(equity / currentPrice).

    RewardRiskLabel:
      type: string
      enum: [EXCELLENT, ACCEPTABLE, MARGINAL, UNFAVORABLE, NOT_APPLICABLE]
      description: |
        Etichetta qualitativa del rapporto reward/risk vs DCF intrinsic value
        (US-100). EXCELLENT ≥3:1; ACCEPTABLE ≥2:1; MARGINAL ≥1:1; UNFAVORABLE
        <1; NOT_APPLICABLE (DCF assente o ≤ currentPrice).

    TaPriceLevel:
      type: object
      required: [price, type, confidence]
      description: Singolo livello structural support/resistance (US-098).
      properties:
        price:      { type: number }
        type:       { $ref: '#/components/schemas/SupportType' }
        confidence: { $ref: '#/components/schemas/LevelConfidence' }

    TaTrendBlock:
      type: object
      required: [classification]
      description: Trend primario daily — SMA50/SMA200 + classificazione deterministica.
      properties:
        sma50:              { type: number, nullable: true }
        sma200:             { type: number, nullable: true }
        classification:     { $ref: '#/components/schemas/TrendClassification' }
        sma200SlopePerDay:  { type: number, nullable: true, description: "Slope regressione lineare 20 sedute (frazione SMA / giorno)" }
        confidenceReduced:  { type: boolean, default: false, description: "True quando lo storico EOD e' < 200 sedute" }

    TaMomentumBlock:
      type: object
      description: Momentum — RSI 14d + MACD daily/weekly (Triple Screen Elder).
      properties:
        rsi14:              { type: number, nullable: true, description: "RSI 14 giorni, 0..100" }
        macdDaily:          { type: number, nullable: true, description: "MACD daily (12,26,9) — valore latest da FMP" }
        macdWeekly:         { type: number, nullable: true, description: "MACD weekly — Screen 1 Elder" }
        confidenceReduced:  { type: boolean, default: false }

    TaVolatilityBlock:
      type: object
      description: Volatilita' — ATR(14) per stop-placement (Murphy §Page 82, Elder).
      properties:
        atr14:              { type: number, nullable: true }
        confidenceReduced:  { type: boolean, default: false }

    TaVolumeBlock:
      type: object
      description: Volume e OBV (On-Balance Volume) per conferma breakout/breakdown.
      properties:
        obv:                { type: number, nullable: true, description: "On-Balance Volume cumulativo latest" }
        avgVolume20d:       { type: number, nullable: true, description: "Volume medio ultime 20 sedute" }
        confidenceReduced:  { type: boolean, default: false }

    TaLevelsBlock:
      type: object
      required: [support, resistance]
      description: Livelli structural — max 3 ciascuno, ordinati per distanza dal prezzo corrente.
      properties:
        support:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/TaPriceLevel' }
        resistance:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/TaPriceLevel' }
        confidenceReduced:  { type: boolean, default: false }

    TaPriceContextBlock:
      type: object
      description: Contesto di prezzo — 52w range + drawdown dal picco (magnitudo positiva 0..1).
      properties:
        currentPrice:        { type: number, nullable: true }
        high52w:             { type: number, nullable: true }
        low52w:              { type: number, nullable: true }
        drawdownFrom52wHigh: { type: number, nullable: true, description: "Magnitudo 0..1 (0.32 = -32% dal picco)" }
        confidenceReduced:   { type: boolean, default: false }

    ReentryCondition:
      type: object
      required: [code, description]
      description: Condizione di re-entry per WAIT (machine + human readable, US-099).
      properties:
        code:        { $ref: '#/components/schemas/ReentryConditionCode' }
        description: { type: string }

    EntryTimingRationale:
      type: object
      required: [screen1, screen2, screen3, wikiCitations]
      description: Rationale strutturato Triple-Screen + citazioni wiki (US-099).
      properties:
        screen1:        { type: string, description: "Nota Screen 1 (trend di lungo)" }
        screen2:        { type: string, description: "Nota Screen 2 (oscillatore: RSI + MACD daily)" }
        screen3:        { type: string, description: "Nota Screen 3 (livello d'entry: support/resistance)" }
        wikiCitations:
          type: array
          items: { type: string }
          description: Pagine wiki che giustificano il verdetto

    EntryTimingAdvisor:
      type: object
      required: [verdict, rationale, viGate]
      description: |
        Verdetto Triple-Screen Elder (US-099). Layer ADVISORY: NON sostituisce
        il verdetto VI. Il campo `viGate` espone il disclaimer machine-readable
        — il Riepilogo (US-103) e' l'unico autorizzato a comporre VI + TA.
      properties:
        verdict:           { $ref: '#/components/schemas/EntryTimingVerdict' }
        reentryCondition:
          allOf:
            - $ref: '#/components/schemas/ReentryCondition'
          nullable: true
          description: Presente solo quando verdict = WAIT
        rationale:         { $ref: '#/components/schemas/EntryTimingRationale' }
        viGate:
          type: string
          default: this_advisor_assumes_vi_verdict_positive
          description: Disclaimer machine-readable. Costante.

    StopSuggestion:
      type: object
      required: [type, rationale]
      description: |
        Stop ancorato a struttura (US-100, TSK-330). Priorita': SUPPORT_BASED >
        SMA200_BASED > ATR_BASED > NOT_CALCULABLE. Buffer 0.5% applicato a
        SUPPORT_BASED e SMA200_BASED (Murphy §Page 82).
      properties:
        type:             { $ref: '#/components/schemas/StopType' }
        stopPrice:        { type: number, nullable: true, description: "USD. Null se NOT_CALCULABLE" }
        stopDistance:     { type: number, nullable: true, description: "currentPrice - stopPrice" }
        stopDistancePct:  { type: number, nullable: true, description: "Distanza stop come % del prezzo" }
        anchorReference:  { type: string, nullable: true, description: "Riferimento human-readable (es. 'support@$47.5 (SWING_LOW)')" }
        rationale:        { type: string }

    TwoPercentRule:
      type: object
      required: [equity, maxRiskAllowed, sharesRecommended, positionValueRecommended, positionPctEquity]
      description: |
        Position sizing 2% Rule Elder §50 (US-100). `equity` e' un input client-side,
        NON viene mai persistito server-side.
      properties:
        equity:                    { type: number }
        maxRiskAllowed:            { type: number, description: "equity × 0.02" }
        stopDistance:              { type: number, nullable: true }
        sharesRecommended:         { type: integer, format: int64, description: "floor(maxRiskAllowed / stopDistance); 0 se stopDistance non disponibile" }
        positionValueRecommended:  { type: number }
        positionPctEquity:         { type: number }
        warning:
          allOf:
            - $ref: '#/components/schemas/PositionSizingWarning'
          nullable: true

    SixPercentRule:
      type: object
      required: [maxAggregateRiskPerMonth, disclaimer]
      description: |
        Heat di portafoglio Elder §51 (Iron Triangle, US-100). Il BE NON traccia
        le altre posizioni dell'utente — espone solo il budget aggregato.
      properties:
        maxAggregateRiskPerMonth: { type: number, description: "equity × 0.06" }
        disclaimer:               { type: string }

    PositionSizing:
      type: object
      required: [twoPercentRule, sixPercentRule]
      description: Sizing 2%/6% Rule (US-100).
      properties:
        twoPercentRule: { $ref: '#/components/schemas/TwoPercentRule' }
        sixPercentRule: { $ref: '#/components/schemas/SixPercentRule' }

    RewardRiskRatio:
      type: object
      required: [label, rationale]
      description: |
        Rapporto reward/risk vs DCF intrinsic value (US-100). upside =
        dcfIntrinsicValue − currentPrice; downside = stopDistance. NOT_APPLICABLE
        se DCF assente, DCF ≤ currentPrice, o stop non calcolabile.
      properties:
        upside:    { type: number, nullable: true }
        downside:  { type: number, nullable: true }
        value:     { type: number, nullable: true, description: "upside / downside" }
        label:     { $ref: '#/components/schemas/RewardRiskLabel' }
        rationale: { type: string }

    TechnicalAnalysisResponse:
      type: object
      required: [ticker, evaluatedAt, trend, momentum, volatility, volume, levels, priceContext]
      description: |
        Payload del nuovo endpoint GET /api/analysis/{ticker}/technical
        (EP-024 Fase 1: US-098 6 blocchi indicatori + US-099 entryTimingAdvisor
        + US-100 stopSuggestion/positionSizing/rewardRiskRatio).

        Layer ADVISORY di timing — NON sostituisce il verdetto VI del Rule Engine
        (`/api/analysis/{ticker}` resta invariato). I 3 advisor sono opzionali a
        livello schema (additive non-breaking) ma sempre popolati in produzione.
      properties:
        ticker:               { type: string }
        evaluatedAt:          { type: string, format: date-time }
        trend:                { $ref: '#/components/schemas/TaTrendBlock' }
        momentum:             { $ref: '#/components/schemas/TaMomentumBlock' }
        volatility:           { $ref: '#/components/schemas/TaVolatilityBlock' }
        volume:               { $ref: '#/components/schemas/TaVolumeBlock' }
        levels:               { $ref: '#/components/schemas/TaLevelsBlock' }
        priceContext:         { $ref: '#/components/schemas/TaPriceContextBlock' }
        entryTimingAdvisor:
          allOf:
            - $ref: '#/components/schemas/EntryTimingAdvisor'
          nullable: true
        stopSuggestion:
          allOf:
            - $ref: '#/components/schemas/StopSuggestion'
          nullable: true
        positionSizing:
          allOf:
            - $ref: '#/components/schemas/PositionSizing'
          nullable: true
        rewardRiskRatio:
          allOf:
            - $ref: '#/components/schemas/RewardRiskRatio'
          nullable: true

    # ---------------- EP-024 Fase 2 — Riepilogo cross-dominio (US-103) ----------------

    SummaryVerdict:
      type: string
      enum: [ENTER_NOW, WAIT_FOR_SETUP, AVOID, INSUFFICIENT_DATA]
      description: |
        Verdetto azionabile del Riepilogo cross-dominio (US-103):
        - ENTER_NOW: VI gate passato + Deep OK/NOT_AVAILABLE + TA favorable/neutral.
        - WAIT_FOR_SETUP: VI gate passato ma TA o Deep sfavorevole (situazione COPART) — reentryCondition esposta.
        - AVOID: VI gate fallito (titolo VI-negativo non puo' MAI diventare ENTER_NOW) OPPURE Munger RISCHIO_ESTREMO override.
        - INSUFFICIENT_DATA: dati VI troppo lacunosi (≥ 1/3 ruleId INDETERMINATE/NOT_CALCULABLE).

    ViVerdict:
      type: string
      enum: [GREEN_DOMINANT, YELLOW_DOMINANT, RED_DOMINANT, INDETERMINATE_DOMINANT]
      description: |
        Classificazione aggregata del verdetto VI, proporzionale sui ruleId DECISIONALI
        disponibili (ADR-030 §3 — NCAV_LATEST informativo escluso, INDETERMINATE/NOT_CALCULABLE esclusi):
        - GREEN_DOMINANT: quota GREEN ≥ 60% dei decisionali disponibili.
        - RED_DOMINANT: quota GREEN < 33% dei decisionali disponibili.
        - YELLOW_DOMINANT: intervallo intermedio (33% ≤ quota < 60%).
        - INDETERMINATE_DOMINANT: ≥ 1/3 dei ruleId sono INDETERMINATE/NOT_CALCULABLE.

    DeepAnalysisStatus:
      type: string
      enum: [AVAILABLE, NOT_INDEXED, NOT_AVAILABLE]
      description: |
        Stato della Deep Analysis (Munger inversion):
        - AVAILABLE: deep analysis indicizzata + analizzata, deepVerdict popolato.
        - NOT_INDEXED: nessuna run eseguita per il ticker, deepVerdict = null. Non blocca il Summary.
        - NOT_AVAILABLE: deep analysis tecnicamente indisponibile (es. FAILED, schema drift).

    DeepVerdict:
      type: string
      enum: [OK, WATCHLIST, RISCHIO_ESTREMO]
      description: |
        Verdetto sintetico Deep Analysis rispetto al gate del Summary:
        - OK: Munger APPROVATO / APPROVATO_PANIC_BUY → compatibile con ENTER_NOW.
        - WATCHLIST: Munger WATCHLIST → degrada a WAIT_FOR_SETUP.
        - RISCHIO_ESTREMO: Munger RISCHIO_ESTREMO → override gate VI → AVOID (regola assoluta).

    WikiCitation:
      type: object
      required: [id, domain]
      description: |
        Citazione di una pagina wiki cross-dominio (US-103 §"Citazioni RAG cross-dominio").
        `id` = slug della pagina (= `wiki_source_id` in `filing_chunks`).
      properties:
        id:
          type: string
          example: ta-vs-vi-decision-layer
        anchor:
          type: string
          nullable: true
          description: Ancora opzionale al paragrafo specifico della pagina wiki.
        domain:
          type: string
          description: "Dominio della pagina wiki: value-investing | technical-analysis-trading."
          example: technical-analysis-trading

    SummaryRationale:
      type: object
      required: [viSummary, decisionPath]
      description: |
        Rationale narrativo del Riepilogo. I 3 *Summary sono generati dall'LLM
        (1 sola call); il `decisionPath` e' deterministico (mai LLM).
      properties:
        viSummary:
          type: string
          description: Sintesi narrativa del verdetto VI (LLM o fallback deterministico).
        deepSummary:
          type: string
          nullable: true
          description: Sintesi narrativa della Deep Analysis. Null se deepAnalysisStatus != AVAILABLE.
        taSummary:
          type: string
          nullable: true
          description: Sintesi narrativa del verdetto TA. Null se taVerdict = null.
        decisionPath:
          type: string
          description: Riassunto testuale deterministico del gate applicato. Sempre presente.

    SummaryVerdictResponse:
      type: object
      required:
        - ticker
        - evaluatedAt
        - summaryVerdict
        - viVerdict
        - deepAnalysisStatus
        - rationale
        - wikiCitations
      description: |
        Payload del Riepilogo cross-dominio VI + Deep + TA (EP-024 Fase 2, US-103).

        Verdetti tipati (`summaryVerdict`, `viVerdict`, `deepVerdict`, `taVerdict`):
        prodotti da pure-function Kotlin con tabella di mapping hardcoded
        (ADR-030 §3+§5). L'LLM (1 sola call) genera solo i 3 campi narrativi del
        `rationale`.

        Gate VI primario hardcoded: un titolo con `viVerdict = RED_DOMINANT` non
        puo' MAI diventare `ENTER_NOW`, indipendentemente da TA. Munger
        `RISCHIO_ESTREMO` overrides il gate VI → AVOID.

        `warningAntiCopart` presente SOLO quando `viVerdict = GREEN_DOMINANT` AND
        `taVerdict ∈ {WAIT, ENTRY_UNFAVORABLE}` AND `summaryVerdict = WAIT_FOR_SETUP`.
      properties:
        ticker:              { type: string }
        evaluatedAt:         { type: string, format: date-time }
        summaryVerdict:      { $ref: '#/components/schemas/SummaryVerdict' }
        viVerdict:           { $ref: '#/components/schemas/ViVerdict' }
        deepAnalysisStatus:  { $ref: '#/components/schemas/DeepAnalysisStatus' }
        deepVerdict:
          allOf:
            - $ref: '#/components/schemas/DeepVerdict'
          nullable: true
          description: Null quando deepAnalysisStatus != AVAILABLE (US-103 AC).
        taVerdict:
          allOf:
            - $ref: '#/components/schemas/EntryTimingVerdict'
          nullable: true
          description: Null quando la TA non e' calcolabile (FMP indisponibile).
        rationale:           { $ref: '#/components/schemas/SummaryRationale' }
        reentryCondition:
          allOf:
            - $ref: '#/components/schemas/ReentryCondition'
          nullable: true
          description: |
            Condizione tecnica di re-entry quando summaryVerdict = WAIT_FOR_SETUP
            AND taVerdict = WAIT. Propagata dall'EntryTimingAdvisor (US-099).
        wikiCitations:
          type: array
          items: { $ref: '#/components/schemas/WikiCitation' }
          description: Citazioni RAG cross-dominio (US-103 §"Citazioni RAG cross-dominio").
        warningAntiCopart:
          type: string
          nullable: true
          description: |
            Warning anti-COPART. Presente SOLO quando viVerdict = GREEN_DOMINANT
            AND taVerdict ∈ {WAIT, ENTRY_UNFAVORABLE} AND summaryVerdict = WAIT_FOR_SETUP.

    # ---------------- EP-024 Fase 3 — Backtest per-ticker (US-105) ----------------

    BacktestStatus:
      type: string
      enum: [OK, INSUFFICIENT_HISTORY]
      description: |
        Stato del backtest (US-105):
        - OK: backtest completato, metriche presenti.
        - INSUFFICIENT_HISTORY: lo storico FMP non copre la finestra richiesta
          (IPO recente o `years` troppo lunghi rispetto al disponibile);
          `insufficientHistoryReason` esplicito, NESSUN risultato parziale.

    BacktestStrategy:
      type: string
      enum: [EP024_ENTER_NOW, VI_ONLY, BUY_AND_HOLD]
      description: |
        Strategia simulata sulla stessa finestra di lookback (US-105):
        - EP024_ENTER_NOW: apre un trade ad ogni `t` con verdetto EP-024
          ENTER_NOW (gate VI + TA favorevole), chiude alla prima tra
          VI_TARGET / STOP_HIT / HORIZON.
        - VI_ONLY: ignora il timing TA — entra ad ogni `t` con gate VI
          positivo, stesse regole di uscita. Baseline per isolare il valore
          del layer di timing.
        - BUY_AND_HOLD: trade unico — compra al primo EOD della finestra,
          vende all'ultimo.

    BacktestExitReason:
      type: string
      enum: [VI_TARGET, STOP_HIT, HORIZON]
      description: |
        Causale di uscita dal round-trip (US-105, priorita' decrescente):
        - VI_TARGET: prezzo >= dcfIntrinsicValue a t — la margin of safety
          si e' chiusa (disciplina di vendita value).
        - STOP_HIT: prezzo <= stopSuggestion.stopPrice a t — la tesi/struttura
          si e' rotta (Murphy §Page 82, Elder §50).
        - HORIZON: raggiunto `horizonMonths` senza target ne stop — chiusura
          forzata al prezzo corrente.

    BacktestTimingEdgeLabel:
      type: string
      enum: [POSITIVE_EDGE, NEUTRAL, NEGATIVE_EDGE]
      description: |
        Etichetta del `timingEdgePct` (EP024 − VI_ONLY, US-105):
        - POSITIVE_EDGE: timing TA ha aggiunto soldi (>+2pp di edge).
        - NEGATIVE_EDGE: timing TA ha distrutto soldi (<-2pp di edge).
        - NEUTRAL: edge irrilevante (entro ±2pp). Una feature di timing
          ricorrentemente NEUTRAL/NEGATIVE_EDGE non sta dando valore al
          verdetto (lente di valore [[value-investing-design-lens]]).

    BacktestWindow:
      type: object
      required: [fromDate, toDate, years, horizonMonths]
      description: Finestra di lookback effettivamente coperta dal backtest.
      properties:
        fromDate:        { type: string, format: date }
        toDate:          { type: string, format: date }
        years:           { type: integer, description: "Years parameter ricevuto" }
        horizonMonths:   { type: integer, description: "HorizonMonths parameter ricevuto" }

    BacktestExitBreakdown:
      type: object
      description: Conteggio dei trade per causale di uscita.
      properties:
        viTarget:        { type: integer, default: 0 }
        stopHit:         { type: integer, default: 0 }
        horizon:         { type: integer, default: 0 }

    BacktestStrategyMetrics:
      type: object
      required: [strategy, trades]
      description: |
        Metriche aggregate per strategia (US-105 §"Metriche aggregate").
        `winRate` / `avgRealizedRewardRisk` / `exitBreakdown` sono null per
        BUY_AND_HOLD (trade unico).
      properties:
        strategy:                 { $ref: '#/components/schemas/BacktestStrategy' }
        trades:                   { type: integer, description: "Numero di round-trip aperti nella finestra" }
        winRate:                  { type: number, nullable: true, description: "Quota di trade con returnPct > 0. Null se trades=0" }
        avgReturnPct:             { type: number, nullable: true, description: "Media aritmetica dei returnPct per round-trip" }
        medianReturnPct:          { type: number, nullable: true, description: "Mediana dei returnPct per round-trip" }
        avgHoldingDays:           { type: number, nullable: true, description: "Media degli holding days per round-trip" }
        avgRealizedRewardRisk:    { type: number, nullable: true, description: "Media del rapporto (returnPct / drawdown intra-trade). Null se trades=0 o nessun trade con drawdown > 0" }
        totalReturnPct:           { type: number, nullable: true, description: "Total return composto (prodotto dei (1+returnPct) − 1)" }
        maxTradeDrawdownPct:      { type: number, nullable: true, description: "Drawdown massimo intra-trade osservato sull'intera serie (magnitudo positiva)" }
        exitBreakdown:
          allOf:
            - $ref: '#/components/schemas/BacktestExitBreakdown'
          nullable: true
          description: Null per BUY_AND_HOLD.
        noSignalsInPeriod:
          type: boolean
          default: false
          description: True quando la strategia non ha generato alcun trade nella finestra (es. EP024 senza segnali ENTER_NOW).

    BacktestTimingEdge:
      type: object
      required: [label, noSignalsInPeriod]
      description: |
        Edge del layer di timing TA (US-105 §"Baseline di confronto"):
        differenza in punti percentuali tra `avgReturnPct` di
        `EP024_ENTER_NOW` e di `VI_ONLY`. Risponde a "il timing TA ha
        fatto guadagnare di piu' rispetto a comprare appena il titolo era
        a sconto?".
      properties:
        timingEdgePct:
          type: number
          nullable: true
          description: "avgReturnPct(EP024) − avgReturnPct(VI_ONLY). Null se una delle due strategie non ha trade."
        label:               { $ref: '#/components/schemas/BacktestTimingEdgeLabel' }
        noSignalsInPeriod:
          type: boolean
          description: True se EP024_ENTER_NOW non ha generato segnali nella finestra (degrada il confronto, label=NEUTRAL).

    BacktestTrade:
      type: object
      required: [strategy, entryDate, entryPrice, exitDate, exitPrice, exitReason, returnPct, holdingDays, maxIntraTradeDrawdownPct]
      description: Singolo round-trip simulato (entry → exit) per le strategie EP024_ENTER_NOW e VI_ONLY (US-105).
      properties:
        strategy:                  { $ref: '#/components/schemas/BacktestStrategy' }
        entryDate:                 { type: string, format: date }
        entryPrice:                { type: number }
        exitDate:                  { type: string, format: date }
        exitPrice:                 { type: number }
        exitReason:                { $ref: '#/components/schemas/BacktestExitReason' }
        returnPct:                 { type: number, description: "(exitPrice − entryPrice) / entryPrice × 100" }
        holdingDays:               { type: integer, description: "Giorni di calendario tra entryDate e exitDate" }
        maxIntraTradeDrawdownPct:  { type: number, description: "Drawdown intra-trade massimo (magnitudo positiva, %)" }

    BacktestCaveats:
      type: object
      description: |
        Onesta dei limiti del backtest (US-105 §"Onesta dei limiti").
        SEMPRE presente nel payload, anche per status=OK. Un backtest che
        nasconde i bias residui e' marketing, non evidenza.
      properties:
        lookAheadResidual:
          type: boolean
          default: true
          description: "Fondamentali FMP serviti ristrutturati: filingDate elimina il look-ahead grossolano ma non le revisioni successive."
        singleTicker:
          type: boolean
          default: true
          description: "Single ticker — niente survivorship bias, ma risultato NON generalizzabile."
        notPortfolioPerformance:
          type: boolean
          default: true
          description: "Verifica storica del timing su QUESTO ticker, NON una equity curve di portafoglio."

    BacktestResponse:
      type: object
      required:
        - ticker
        - evaluatedAt
        - status
        - caveats
      description: |
        Payload del nuovo endpoint GET /api/analysis/{ticker}/backtest
        (EP-024 Fase 3, US-105).

        Misura il round-trip completo della strategia EP-024 (entry sui
        segnali `ENTER_NOW`, exit alla prima tra VI_TARGET / STOP_HIT /
        HORIZON) e lo confronta con due baseline (`VI_ONLY` e `BUY_AND_HOLD`).

        `timingEdgePct` = EP024.avgReturnPct − VI_ONLY.avgReturnPct e' la
        metrica chiave: se NEGATIVE_EDGE ricorrente, il layer di timing
        non sta dando valore (lente di valore).

        Calcolo deterministico pure-function Kotlin, niente LLM. `equity`
        MAI persistita server-side. `caveats` SEMPRE presente.

        `INSUFFICIENT_HISTORY` esplicito quando lo storico FMP non copre
        la finestra: nessuna finestra parziale silenziosa.
      properties:
        ticker:                   { type: string }
        evaluatedAt:              { type: string, format: date-time }
        status:                   { $ref: '#/components/schemas/BacktestStatus' }
        insufficientHistoryReason:
          type: string
          nullable: true
          description: Presente SOLO quando status = INSUFFICIENT_HISTORY.
        window:
          allOf:
            - $ref: '#/components/schemas/BacktestWindow'
          nullable: true
          description: Null quando status = INSUFFICIENT_HISTORY.
        strategies:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/BacktestStrategyMetrics' }
          description: |
            Lista di 3 metriche aggregate (EP024_ENTER_NOW, VI_ONLY,
            BUY_AND_HOLD). Null quando status = INSUFFICIENT_HISTORY.
        timingEdge:
          allOf:
            - $ref: '#/components/schemas/BacktestTimingEdge'
          nullable: true
          description: Edge del layer di timing TA vs VI puro. Null quando status = INSUFFICIENT_HISTORY.
        trades:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/BacktestTrade' }
          description: |
            Trade individuali per EP024_ENTER_NOW e VI_ONLY (BUY_AND_HOLD ha
            un solo trade implicito esposto via strategies.totalReturnPct).
            Null quando status = INSUFFICIENT_HISTORY.
        caveats:                  { $ref: '#/components/schemas/BacktestCaveats' }

    # ---------------- EP-012 top value picks (US-050) ----------------
    TopPickItem:
      type: object
      required: [ticker, rankPosition, verdettoClasse, source]
      properties:
        ticker:           { type: string }
        rankPosition:     { type: integer, description: "1-based ranking within run_date (sort key)" }
        verdettoClasse:
          type: string
          enum: [APPROVATO, APPROVATO_PANIC_BUY, WATCHLIST]
          description: "Classificazione Munger cascade — solo i 3 valori esposti dal job (top-N filter)"
        marginOfSafety:   { type: number, format: double, nullable: true, description: "Numeric(10,4) lato DB; null se DCF non disponibile" }
        sector:           { type: string, nullable: true }
        marketCapUsd:     { type: integer, format: int64, nullable: true }
        source:
          type: string
          enum: [SCREENER, THIRTEEN_F, NEWS_SCOUT]
          description: "Provenienza candidato (UniverseScreenerService dedupe order)"
        companyName:      { type: string, nullable: true }

    TopPicksPageResponse:
      type: object
      required: [page, size, total, items]
      description: |
        Paginated response for GET /api/top-picks. `runDate` può essere null se
        il batch non ha ancora prodotto alcuna run (primo deploy o DB vuoto).
      properties:
        runDate:
          type: string
          format: date
          nullable: true
        page:  { type: integer }
        size:  { type: integer }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/TopPickItem' }
