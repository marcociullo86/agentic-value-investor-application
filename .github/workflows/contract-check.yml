name: contract-check

on:
  push:
    branches: [master, "feature/**"]
  pull_request:

jobs:
  be-contract:
    name: BE OpenAPI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run OpenAPI contract tests
        run: gradle contractCheck --no-daemon

  fe-contract:
    name: FE OpenAPI types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package.json
      - name: Install dependencies
        # --legacy-peer-deps: swr@2.2.5 vs react@19 peer mismatch.
        # Same pattern as fe-test/fe-e2e jobs in ci.yml and the Dockerfile;
        # follow-up gap `fe-swr-peer-r19` will bump swr once it widens
        # the peer range to include react 19.
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Generate API types from openapi.yaml
        run: npm run generate:api
      - name: Typecheck generated API types
        run: npm run typecheck:api
