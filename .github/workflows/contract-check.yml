name: contract-check

on:
  push:
    branches: [master, "feature/**"]
  pull_request:

jobs:
  be-contract:
    name: BE OpenAPI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      JWT_SIGNING_SECRET: "ci-contract-signing-secret-min-32-bytes-for-hs256-ok"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run OpenAPI contract tests
        run: |
          set -o pipefail
          gradle contractCheck --no-daemon --info 2>&1 | tee /tmp/gradle-contract.log | tail -300
      - name: Surface test failures as annotations
        if: failure()
        run: |
          for f in build/test-results/contractCheck/TEST-*.xml; do
            if [ -f "$f" ]; then
              if grep -q 'failures="[1-9]\|errors="[1-9]' "$f" 2>/dev/null; then
                testname="$(basename "$f" .xml | sed 's/^TEST-//')"
                msg="$(grep -A30 '<failure\|<error' "$f" | head -80 | tr '\n' '|')"
                echo "::error title=Test failure: $testname::$msg"
              fi
            fi
          done
          causes="$(grep -A1 'Caused by:' /tmp/gradle-contract.log 2>/dev/null | head -40 | tr '\n' '|')"
          if [ -n "$causes" ]; then
            echo "::error title=Root cause chain::$causes"
          fi
          echo ""
          echo "=== Gradle FAILED lines ==="
          grep -B2 -A5 'FAILED' /tmp/gradle-contract.log 2>/dev/null | tail -150 || true

  fe-contract:
    name: FE OpenAPI types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package.json
      - name: Install dependencies
        # swr@2.4.1+ supports React 19 (TSK-053).
        # Same pattern as fe-test/fe-e2e jobs in ci.yml and the Dockerfile;
        # follow-up gap `fe-swr-peer-r19` will bump swr once it widens
        # the peer range to include react 19.
        run: npm install --no-audit --no-fund
      - name: Generate API types from openapi.yaml
        run: npm run generate:api
      - name: Typecheck generated API types
        run: npm run typecheck:api
