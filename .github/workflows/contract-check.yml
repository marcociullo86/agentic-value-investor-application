name: contract-check

on:
  push:
    branches: [master, "feature/**"]
  pull_request:

jobs:
  be-contract:
    name: BE OpenAPI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      JWT_SIGNING_SECRET: "ci-contract-signing-secret-min-32-bytes-for-hs256-ok"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run OpenAPI contract tests
        run: gradle contractCheck --no-daemon --info 2>&1 | tail -200
      - name: Print test failures on error
        if: failure()
        run: |
          echo "## contractCheck test failures" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in build/test-results/contractCheck/TEST-*.xml; do
            if [ -f "$f" ]; then
              if grep -q 'failures="[1-9]\|errors="[1-9]' "$f" 2>/dev/null; then
                echo "--- $(basename "$f") ---" | tee -a "$GITHUB_STEP_SUMMARY"
                grep -A30 '<failure\|<error' "$f" | head -80 | tee -a "$GITHUB_STEP_SUMMARY"
                echo | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "=== All test XML files ==="
          ls -la build/test-results/contractCheck/ 2>/dev/null || echo "No test results directory"
          echo ""
          echo "=== Gradle build output (last 100 lines) ==="
          cat build/reports/tests/contractCheck/index.html 2>/dev/null | head -200 || echo "No HTML report"

  fe-contract:
    name: FE OpenAPI types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package.json
      - name: Install dependencies
        # swr@2.4.1+ supports React 19 (TSK-053).
        # Same pattern as fe-test/fe-e2e jobs in ci.yml and the Dockerfile;
        # follow-up gap `fe-swr-peer-r19` will bump swr once it widens
        # the peer range to include react 19.
        run: npm install --no-audit --no-fund
      - name: Generate API types from openapi.yaml
        run: npm run generate:api
      - name: Typecheck generated API types
        run: npm run typecheck:api
