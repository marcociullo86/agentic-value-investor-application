name: ci

# Monorepo CI pipeline — BE tests, FE tests, scaffold E2E, smoke Docker build.
# [^src: management/kanban/.../TSK-032.md §Pipeline CI]
# [^src: design_&_architecture/decisions/ADR-009-deployment-target.md §Build artifact]
#
# Note: questo workflow vive accanto a `contract-check.yml` (committato in un
# commit precedente). Convenzione GitHub: i workflow DEVONO stare in
# `.github/workflows/` del repo root. Deviazione formale dal vincolo
# `<code_path>/**` autorizzata in TSK-032 (vedi marker `develop` in wiki/log.md).

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  be-test:
    name: BE — gradle test (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit + integration tests
        # Profilo `test` viene attivato dai test stessi (Testcontainers gestisce
        # PostgreSQL autonomamente tramite Docker socket esposto dal runner).
        run: gradle test --no-daemon

  fe-test:
    name: FE — vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run vitest
        # I test placeholder posati da TSK-030 sono in src/frontend/__tests__/utils.
        run: npm run test

  fe-e2e:
    name: FE — Playwright (scaffold-only)
    runs-on: ubuntu-latest
    needs: [be-test]
    steps:
      - uses: actions/checkout@v4
      # SCAFFOLD: Playwright non è ancora dipendenza del frontend (vedi TSK-030).
      # I test E2E reali arriveranno in TSK-022 / TSK-036. Step minimo per
      # mantenere il job visibile in CI senza falsi negativi.
      - name: Placeholder
        run: |
          echo "Playwright E2E will be wired in TSK-022 (real suite) / TSK-036 (Playwright dep)"
          echo "Skipping execution — scaffold-only job per TSK-032 brief."

  docker-build:
    name: Docker — smoke build
    runs-on: ubuntu-latest
    needs: [be-test, fe-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        # Context = repo root, Dockerfile in src/docker/Dockerfile.
        # `--load` evita caricamento registry; tag locale `vi-webapp:ci`.
        run: |
          docker buildx build \
            --file src/docker/Dockerfile \
            --tag vi-webapp:ci \
            --load \
            .
