name: ci

# Monorepo CI pipeline — BE tests, FE tests, scaffold E2E, smoke Docker build.
# [^src: management/kanban/.../TSK-032.md §Pipeline CI]
# [^src: design_&_architecture/decisions/ADR-009-deployment-target.md §Build artifact]
#
# Note: questo workflow vive accanto a `contract-check.yml` (committato in un
# commit precedente). Convenzione GitHub: i workflow DEVONO stare in
# `.github/workflows/` del repo root. Deviazione formale dal vincolo
# `<code_path>/**` autorizzata in TSK-032 (vedi marker `develop` in wiki/log.md).

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  be-test:
    name: BE — gradle test (Testcontainers)
    runs-on: ubuntu-latest
    services:
      # ContextLoadsTest (Sprint 1 smoke) uses @SpringBootTest with the test
      # profile datasource (jdbc:postgresql://localhost:5432/value_investing_test)
      # and is NOT Testcontainers-backed. Provide a stable postgres so the
      # context boots; the Testcontainers-based ITs still spin up their own
      # ephemeral containers and ignore this service.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: value_investing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    env:
      JWT_SIGNING_SECRET: "ci-be-test-signing-secret-min-32-bytes-for-hs256-okok"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit + integration tests
        # Profilo `test` viene attivato dai test stessi (Testcontainers gestisce
        # PostgreSQL autonomamente tramite Docker socket esposto dal runner).
        run: gradle test --no-daemon

  fe-test:
    name: FE — vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run vitest
        # I test placeholder posati da TSK-030 sono in src/frontend/__tests__/utils.
        run: npm run test

  fe-e2e:
    name: FE — Playwright (auth + watchlist)
    runs-on: ubuntu-latest
    needs: [be-test, fe-test]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: value_investing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/value_investing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SIGNING_SECRET: "ci-e2e-signing-secret-min-32-bytes-for-hs256-okok"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
      E2E_API_BASE_URL: "http://localhost:8080"
      E2E_BASE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package.json
      - name: Install backend artifacts (no test)
        working-directory: src/backend
        run: gradle bootJar --no-daemon -x test
      - name: Start backend in background
        working-directory: src/backend
        run: |
          nohup java -jar build/libs/*.jar \
            --spring.profiles.active=dev \
            --app.fmp.mock=true > be.log 2>&1 &
          echo $! > be.pid
      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "Backend did not come up; tail of be.log:" && tail -200 src/backend/be.log
          exit 1
      - name: Install frontend deps
        working-directory: src/frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend (next dev — output:'export' is build-only)
        working-directory: src/frontend
        run: |
          nohup npm run dev > fe.log 2>&1 &
          echo $! > fe.pid
      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "frontend up"; exit 0
            fi
            sleep 2
          done
          echo "Frontend did not come up; tail of fe.log:" && tail -200 src/frontend/fe.log
          exit 1
      - name: Run Playwright tests
        working-directory: src/frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          retention-days: 7
      - name: Tail backend log on failure
        if: failure()
        run: tail -300 src/backend/be.log || true
      - name: Tail frontend log on failure
        if: failure()
        run: tail -300 src/frontend/fe.log || true

  docker-build:
    name: Docker — smoke build
    runs-on: ubuntu-latest
    needs: [be-test, fe-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        # Context = repo root, Dockerfile in src/docker/Dockerfile.
        # `--load` evita caricamento registry; tag locale `vi-webapp:ci`.
        run: |
          docker buildx build \
            --file src/docker/Dockerfile \
            --tag vi-webapp:ci \
            --load \
            .
